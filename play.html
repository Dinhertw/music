<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qimei Music Web (Cloud Sync)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, "Microsoft JhengHei", sans-serif; color: #fff; }
    #player-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100vw; height: 100vh; z-index: 1; border-radius: 0px; overflow: hidden; background-color: #000; transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1), height 0.6s cubic-bezier(0.25, 1, 0.5, 1), border-radius 0.6s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
    #player-container.subtitle-active { width: 75vw; height: 65vh; max-width: 1200px; max-height: 675px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8); }
    #player { width: 100%; height: 100%; border: none; pointer-events: auto; }
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; transition: opacity 0.4s ease; }
    .ui-layer * { pointer-events: auto; }
    .bottom-detector { position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; z-index: 5; pointer-events: auto; background: transparent; }
    .header-title-container { display: flex; align-items: center; gap: 10px; width: fit-content; }
    .header-title { font-size: 16px; font-weight: bold; letter-spacing: 1px; background-color: rgba(0, 0, 0, 0.55); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 20px; padding: 10px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); text-shadow: 0 1px 2px rgba(0,0,0,0.6); user-select: none; }
    .sync-indicator { width: 10px; height: 10px; border-radius: 50%; background-color: #ef4444; box-shadow: 0 0 8px #ef4444; transition: background-color 0.3s, box-shadow 0.3s; }
    .sync-indicator.connected { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .subtitle-menu, .feature-menu { position: absolute; bottom: 95px; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px; padding: 8px; width: 190px; max-height: 220px; overflow-y: auto; overflow-x: hidden; display: none; flex-direction: column; gap: 4px; z-index: 10; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
    .subtitle-menu { right: 24px; }
    .feature-menu { right: 120px; width: 240px; }
    .subtitle-menu.active, .feature-menu.active { display: flex; }
    .subtitle-option, .feature-option { background: transparent; border: none; color: #fff; padding: 8px 12px; text-align: left; font-size: 13px; border-radius: 6px; cursor: pointer; transition: background 0.2s ease, color 0.2s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
    .subtitle-option:hover, .feature-option:hover { background: rgba(255, 255, 255, 0.2); color: #4facfe; }
    .feature-option.active-state { color: #4facfe; font-weight: bold; }
    .history-modal { position: absolute; bottom: 130px; left: 20px; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 14px; padding: 12px; width: 320px; max-height: 350px; display: none; flex-direction: column; gap: 8px; z-index: 25; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
    .history-modal.active { display: flex; }
    .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
    .history-item { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 8px 10px; cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease; display: flex; flex-direction: column; gap: 4px; }
    .history-item:hover { background: rgba(255, 255, 255, 0.2); border-color: #4facfe; }
    .history-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-info { font-size: 11px; color: rgba(255, 255, 255, 0.6); display: flex; justify-content: space-between; }
    .playlist-wrapper { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; width: 320px; max-height: calc(100vh - 40px); }
    .playlist-btn-container { width: 120px; height: 40px; background-color: rgba(0, 0, 0, 0.55); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: width 0.3s ease, background-color 0.3s ease, border-color 0.3s ease; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); flex-shrink: 0; }
    .playlist-btn-container.expanded { width: 320px; background-color: rgba(0, 0, 0, 0.85); border-color: #4facfe; }
    .btn-label { font-size: 16px; font-weight: bold; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,0.6); user-select: none; }
    .url-input { width: 100%; height: 100%; background: transparent; border: none; outline: none; color: #fff; padding: 0 15px; font-size: 14px; display: none; }
    .playlist-btn-container.expanded .btn-label { display: none; }
    .playlist-btn-container.expanded .url-input { display: block; }
    .song-list { margin-top: 15px; width: 100%; max-height: calc(100vh - 100px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
    .song-item { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); border-radius: 8px; padding: 8px 12px; font-size: 14px; overflow: hidden; white-space: nowrap; border-left: 3px solid #4facfe; position: relative; z-index: 2; user-select: none; }
    .bottom-container { display: flex; justify-content: center; width: 100%; margin-bottom: 10px; position: relative; z-index: 6; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease; }
    .bottom-container.auto-hidden { transform: translateY(120px); opacity: 0; pointer-events: none; }
    .control-bar { display: flex; flex-direction: column; align-items: center; gap: 10px; background-color: rgba(0, 0, 0, 0.55); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 16px; padding: 12px 24px; width: fit-content; box-shadow: 0 4px 10px rgba(0,0,0,0.4); user-select: none; }
    .timeline-container { display: flex; align-items: center; gap: 12px; font-size: 12px; color: rgba(255, 255, 255, 0.9); text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    .time-slider { -webkit-appearance: none; appearance: none; width: 280px; height: 4px; background: rgba(255, 255, 255, 0.3); border-radius: 2px; outline: none; cursor: pointer; }
    .time-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #4facfe; cursor: pointer; }
    .buttons-container { display: flex; align-items: center; gap: 10px; }
    .control-btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 8px; color: #fff; padding: 6px 16px; font-size: 13px; font-weight: bold; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.5); transition: background 0.2s ease, border-color 0.2s ease; }
    .control-btn:hover { background: rgba(255, 255, 255, 0.3); border-color: #4facfe; }
    .control-btn.active { background: rgba(79, 172, 254, 0.4); border-color: #4facfe; }
  </style>
</head>
<body id="app-body">
  <div id="player-container"><div id="player"></div></div>
  <div class="ui-layer" id="uiLayer">
    <div class="header-title-container">
      <div class="header-title" id="headerTitle">Qimei Music Web</div>
      <div class="sync-indicator" id="syncIndicator" title="雲端同步狀態"></div>
    </div>
    <div class="playlist-wrapper">
      <div class="playlist-btn-container" id="inputContainer">
        <span class="btn-label" id="playlistBtnLabel">播放列表</span>
        <input type="text" class="url-input" id="urlInput" placeholder="請輸入YT連結 (Enter送出)">
      </div>
      <div class="song-list" id="songList"></div>
    </div>
    <div class="bottom-detector" id="bottomDetector"></div>
    <div class="bottom-container" id="bottomContainer">
      <div class="history-modal" id="historyModal">
        <div class="modal-header" style="font-size:13px; font-weight:bold; color:rgba(255,255,255,0.7); padding-bottom:4px; border-bottom:1px solid rgba(255,255,255,0.15); display:flex; justify-content:space-between; align-items:center;">
          <span>歷史播放紀錄</span>
          <span style="font-size: 11px; color: #4facfe; cursor: pointer;" id="closeHistory">關閉</span>
        </div>
        <div class="history-list" id="historyList" style="margin-top:8px;"></div>
      </div>
      <div class="feature-menu" id="featureMenu">
        <button class="feature-option" id="autoHideBtn">自動隱藏介面: 關閉</button>
        <button class="feature-option" id="historyBtn">歷史播放清單</button>
      </div>
      <div class="subtitle-menu" id="subtitleMenu"></div>
      <div class="control-bar">
        <div class="timeline-container">
          <span id="currentTime">00:00</span>
          <input type="range" id="timeSlider" class="time-slider" value="0" min="0" max="100" step="0.1">
          <span id="durationTime">00:00</span>
        </div>
        <div class="buttons-container">
          <button class="control-btn" id="playPauseBtn">暫停</button>
          <button class="control-btn" id="skipBtn">切歌</button>
          <button class="control-btn" id="speedBtn">1.0x</button>
          <button class="control-btn" id="featureBtn">功能</button>
          <button class="control-btn" id="subtitleBtn">字幕</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || 'default_room';

    const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const WS_URL = wsProtocol + window.location.host + '/ws?room=' + encodeURIComponent(room);
    let ws = null;

    let player;
    let playlist = [];
    let playHistory = [];
    let isPlaying = true;
    let isApiReady = false;
    let isUserDraggingSlider = false;
    let isSubtitleActive = false;
    let timeUpdateInterval = null;
    let currentSpeed = 1.0;
    const speeds = [1.0, 1.25, 1.5, 2.0, 0.5];

    let isAutoHiderEnabled = false;
    let autoHideTimer = null;
    const AUTO_HIDE_DELAY = 3000;

    const urlInput = document.getElementById('urlInput');
    const inputContainer = document.getElementById('inputContainer');
    const playlistBtnLabel = document.getElementById('playlistBtnLabel');
    const headerTitle = document.getElementById('headerTitle');
    const syncIndicator = document.getElementById('syncIndicator');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const skipBtn = document.getElementById('skipBtn');
    const speedBtn = document.getElementById('speedBtn');
    const featureBtn = document.getElementById('featureBtn');
    const featureMenu = document.getElementById('featureMenu');
    const autoHideBtn = document.getElementById('autoHideBtn');
    const historyBtn = document.getElementById('historyBtn');
    const historyModal = document.getElementById('historyModal');
    const historyList = document.getElementById('historyList');
    const closeHistory = document.getElementById('closeHistory');
    const subtitleBtn = document.getElementById('subtitleBtn');
    const subtitleMenu = document.getElementById('subtitleMenu');
    const timeSlider = document.getElementById('timeSlider');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const playerContainer = document.getElementById('player-container');
    const bottomContainer = document.getElementById('bottomContainer');
    const bottomDetector = document.getElementById('bottomDetector');

    function initWebSocket() {
      syncIndicator.classList.remove('connected');
      ws = new WebSocket(WS_URL);

      ws.onopen = () => { syncIndicator.classList.add('connected'); };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.action === 'SYNC_STATE') {
            if (data.playlist) {
              const oldFirstId = playlist.length > 0 ? playlist[0].id : null;
              playlist = data.playlist;
              playHistory = data.history || [];
              updatePlaylistUI();

              if (playlist.length > 0) {
                if (playlist[0].id !== oldFirstId) checkAndPlayNext();
              } else {
                if (player && isApiReady && typeof player.stopVideo === 'function') player.stopVideo();
                headerTitle.textContent = 'Qimei Music Web (' + room + ')';
                playlistBtnLabel.textContent = '播放列表';
              }
            }

            if (data.playerState) {
              applyPlayerState(data.playerState);
            }
          } 
          else if (data.action === 'REMOTE_CMD') {
            handleRemoteCommand(data.command);
          } 
          else if (data.action === 'SEEK_TIME') {
            if (player && isApiReady && typeof player.getDuration === 'function') {
              player.seekTo((data.percent / 100) * player.getDuration(), true);
            }
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        syncIndicator.classList.remove('connected');
        setTimeout(initWebSocket, 3000);
      };
    }

    function applyPlayerState(state) {
      if (typeof state.isPlaying === 'boolean' && player && isApiReady) {
        isPlaying = state.isPlaying;
        playPauseBtn.textContent = isPlaying ? '暫停' : '播放';
        if (isPlaying) player.playVideo(); else player.pauseVideo();
      }
      if (typeof state.speed === 'number' && player && isApiReady) {
        currentSpeed = state.speed;
        speedBtn.textContent = currentSpeed + 'x';
        player.setPlaybackRate(currentSpeed);
      }
      if (typeof state.isSubtitleActive === 'boolean' && isSubtitleActive !== state.isSubtitleActive) {
        isSubtitleActive = state.isSubtitleActive;
        updateSubtitleUIState();
      }
      if (typeof state.isAutoHiderEnabled === 'boolean' && isAutoHiderEnabled !== state.isAutoHiderEnabled) {
        isAutoHiderEnabled = state.isAutoHiderEnabled;
        autoHideBtn.textContent = isAutoHiderEnabled ? '自動隱藏介面: 開啟' : '自動隱藏介面: 關閉';
        autoHideBtn.classList.toggle('active-state', isAutoHiderEnabled);
        if (!isAutoHiderEnabled) bottomContainer.classList.remove('auto-hidden');
      }
    }

    function broadcastPlayerState() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          action: 'UPDATE_PLAYER_STATE',
          state: {
            isPlaying: isPlaying,
            speed: currentSpeed,
            isSubtitleActive: isSubtitleActive,
            isAutoHiderEnabled: isAutoHiderEnabled
          }
        }));
      }
    }

    function handleRemoteCommand(cmd) {
      if (cmd === 'togglePlay') togglePlayPause(true);
      if (cmd === 'skip') skipToNextSong();
      if (cmd === 'speed') cyclePlaybackSpeed(true);
      if (cmd === 'subtitle') toggleSubtitleMode(true);
      if (cmd === 'autohide') {
        isAutoHiderEnabled = !isAutoHiderEnabled;
        autoHideBtn.textContent = isAutoHiderEnabled ? '自動隱藏介面: 開啟' : '自動隱藏介面: 關閉';
        autoHideBtn.classList.toggle('active-state', isAutoHiderEnabled);
        if (!isAutoHiderEnabled) bottomContainer.classList.remove('auto-hidden');
        broadcastPlayerState();
      }
    }

    function startTimeTracker() {
      if (timeUpdateInterval) clearInterval(timeUpdateInterval);
      timeUpdateInterval = setInterval(() => {
        if (player && isApiReady && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
          const currentTime = player.getCurrentTime() || 0;
          const duration = player.getDuration() || 0;
          currentTimeEl.textContent = formatTime(currentTime);
          durationTimeEl.textContent = formatTime(duration);
          if (!isUserDraggingSlider && duration > 0) {
            timeSlider.value = (currentTime / duration) * 100;
          }

          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'SYNC_TIME', currentTime, duration }));
          }
        }
      }, 500);
    }

    inputContainer.onclick = () => { inputContainer.classList.add('expanded'); urlInput.focus(); };
    urlInput.onkeydown = (e) => { if (e.key === 'Enter' && urlInput.value.trim()) processYouTubeUrl(urlInput.value.trim()); };

    playPauseBtn.onclick = () => togglePlayPause(true);
    skipBtn.onclick = skipToNextSong;
    speedBtn.onclick = () => cyclePlaybackSpeed(true);

    featureBtn.onclick = () => { featureMenu.classList.toggle('active'); subtitleMenu.classList.remove('active'); };
    autoHideBtn.onclick = () => {
      isAutoHiderEnabled = !isAutoHiderEnabled;
      autoHideBtn.textContent = isAutoHiderEnabled ? '自動隱藏介面: 開啟' : '自動隱藏介面: 關閉';
      autoHideBtn.classList.toggle('active-state', isAutoHiderEnabled);
      featureMenu.classList.remove('active');
      if (!isAutoHiderEnabled) bottomContainer.classList.remove('auto-hidden');
      broadcastPlayerState();
    };

    historyBtn.onclick = () => { featureMenu.classList.remove('active'); renderHistoryUI(); historyModal.classList.toggle('active'); };
    closeHistory.onclick = () => historyModal.classList.remove('active');

    bottomDetector.onmouseenter = wakeUpUI;
    window.onmousemove = (e) => { if (isAutoHiderEnabled && e.clientY >= window.innerHeight - 150) wakeUpUI(); };

    function wakeUpUI() {
      if (!isAutoHiderEnabled) return;
      bottomContainer.classList.remove('auto-hidden');
      if (autoHideTimer) clearTimeout(autoHideTimer);
      autoHideTimer = setTimeout(() => bottomContainer.classList.add('auto-hidden'), AUTO_HIDE_DELAY);
    }

    subtitleBtn.onclick = () => toggleSubtitleMode(true);

    timeSlider.onmousedown = () => { isUserDraggingSlider = true; };
    timeSlider.oninput = (e) => {
      if (player && isApiReady && typeof player.getDuration === 'function') {
        currentTimeEl.textContent = formatTime((e.target.value / 100) * player.getDuration());
      }
    };
    timeSlider.onchange = (e) => {
      if (player && isApiReady && typeof player.seekTo === 'function') {
        player.seekTo((e.target.value / 100) * player.getDuration(), true);
      }
      isUserDraggingSlider = false;
    };

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        host: 'https://www.youtube-nocookie.com',
        playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'enablejsapi': 1 },
        events: {
          'onReady': () => { isApiReady = true; initWebSocket(); checkAndPlayNext(); startTimeTracker(); },
          'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED) skipToNextSong(); }
        }
      });
    }

    function skipToNextSong() {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: 'moveToHistory' }));
    }

    function checkAndPlayNext() {
      if (playlist.length > 0 && isApiReady && player && typeof player.loadVideoById === 'function') {
        isPlaying = true;
        playPauseBtn.textContent = '暫停';
        const curData = player.getVideoData ? player.getVideoData() : null;
        if (!curData || curData.video_id !== playlist[0].id) {
          player.loadVideoById(playlist[0].id);
          player.playVideo();
          player.setPlaybackRate(currentSpeed);
        }
        updateCurrentSongDisplay();
      } else {
        headerTitle.textContent = 'Qimei Music Web (' + room + ')';
        playlistBtnLabel.textContent = '播放列表';
      }
    }

    function updateCurrentSongDisplay() {
      if (playlist.length > 0) {
        headerTitle.textContent = playlist[0].title;
        playlistBtnLabel.textContent = `播放中 (${playlist.length})`;
      } else {
        headerTitle.textContent = 'Qimei Music Web (' + room + ')';
        playlistBtnLabel.textContent = '播放列表';
      }
    }

    function togglePlayPause(broadcast) {
      if (!player || playlist.length === 0) return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        isPlaying = false;
        playPauseBtn.textContent = '播放';
      } else {
        player.playVideo();
        isPlaying = true;
        playPauseBtn.textContent = '暫停';
      }
      if (broadcast) broadcastPlayerState();
    }

    function cyclePlaybackSpeed(broadcast) {
      if (player && isApiReady) {
        const currentIndex = speeds.indexOf(currentSpeed);
        const nextIndex = (currentIndex + 1) % speeds.length;
        currentSpeed = speeds[nextIndex];
        
        player.setPlaybackRate(currentSpeed);
        speedBtn.textContent = currentSpeed + 'x';
        if (broadcast) broadcastPlayerState();
      }
    }

    function toggleSubtitleMode(broadcast) {
      isSubtitleActive = !isSubtitleActive;
      updateSubtitleUIState();
      if (broadcast) broadcastPlayerState();
    }

    function updateSubtitleUIState() {
      if (player && isApiReady) {
        if (isSubtitleActive) {
          player.loadModule('captions');
          player.setOption('captions', 'track', { languageCode: 'zh-Hant' });
          playerContainer.classList.add('subtitle-active');
          subtitleBtn.classList.add('active');
        } else {
          player.unloadModule('captions');
          playerContainer.classList.remove('subtitle-active');
          subtitleBtn.classList.remove('active');
        }
      }
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function extractVideoId(url) {
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function fetchVideoTitle(videoId) {
      try {
        const res = await fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v=' + videoId);
        const data = await res.json();
        return data.title || ('Track ' + videoId);
      } catch (e) { return 'Track ' + videoId; }
    }

    async function processYouTubeUrl(url) {
      const videoId = extractVideoId(url);
      if (!videoId) return;
      const title = await fetchVideoTitle(videoId);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'addSong', song: { id: videoId, title } }));
      }
      urlInput.value = '';
      inputContainer.classList.remove('expanded');
    }

    function renderHistoryUI() {
      historyList.innerHTML = '';
      if (playHistory.length === 0) {
        historyList.innerHTML = '<div style="text-align:center; color:#888; padding:10px;">尚無歷史紀錄</div>';
        return;
      }
      playHistory.forEach(item => {
        const el = document.createElement('div');
        el.className = 'history-item';
        el.innerHTML = `<div class="history-title">${item.title}</div><div class="history-info"><span>${item.requestTime}</span><span>${item.videoDuration}</span></div>`;
        el.onclick = () => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'addSong', song: { id: item.id, title: item.title } }));
          }
          historyModal.classList.remove('active');
        };
        historyList.appendChild(el);
      });
    }

    function updatePlaylistUI() {
      updateCurrentSongDisplay();
      const songList = document.getElementById('songList');
      songList.innerHTML = '';
      playlist.forEach((song, i) => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.textContent = (i === 0 ? '▶ ' : (i + 1) + '. ') + song.title;
        songList.appendChild(item);
      });
    }
  </script>
</body>
</html>
