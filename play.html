<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qimei Music Web (Cloud Sync)</title>
  <!-- 引入 QR Code 生成套件 qrcodejs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: #fff;
    }

    #player-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      z-index: 1;
      border-radius: 0px;
      overflow: hidden;
      background-color: #000;
      will-change: width, height, border-radius, box-shadow;
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                  height 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                  border-radius 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                  box-shadow 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #player-container.subtitle-active {
      width: 75vw;
      height: 65vh;
      max-width: 1200px;
      max-height: 675px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
    }

    #player {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: auto;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .ui-layer * {
      pointer-events: auto;
    }

    .bottom-detector {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 150px;
      z-index: 5;
      pointer-events: auto;
      background: transparent;
    }

    .header-title-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      max-width: calc(100vw - 360px);
    }

    .header-title-wrapper {
      background-color: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 10px 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      user-select: none;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
    }

    .header-title {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      display: inline-block;
    }

    .header-title.marquee-enabled {
      display: inline-block;
      white-space: nowrap;
      animation: headerMarquee 12s linear infinite;
      padding-left: 100%;
    }

    @keyframes headerMarquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .sync-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      transition: background-color 0.3s, box-shadow 0.3s;
      flex-shrink: 0;
    }

    .sync-indicator.connected {
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .subtitle-menu, .feature-menu {
      position: absolute;
      bottom: 95px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 8px;
      width: 190px;
      max-height: 220px;
      overflow-y: auto;
      overflow-x: hidden;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .subtitle-menu { right: 24px; }
    .feature-menu { right: 120px; width: 240px; }

    .subtitle-menu.active, .feature-menu.active {
      display: flex;
    }

    .subtitle-option, .feature-option {
      background: transparent;
      border: none;
      color: #fff;
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    .subtitle-option:hover, .feature-option:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #4facfe;
    }

    .feature-option.active-state {
      color: #4facfe;
      font-weight: bold;
    }

    /* 共用彈窗基礎樣式 (歷史紀錄 / 分享面板) */
    .history-modal, .share-modal {
      position: absolute;
      bottom: 130px;
      left: 20px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      padding: 14px;
      width: 320px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 25;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .history-modal.active, .share-modal.active {
      display: flex;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #4facfe;
    }

    .history-title {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-info {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      display: flex;
      justify-content: space-between;
    }

    /* 分享面板專屬樣式 */
    .share-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 5px 0;
    }

    #qrcodeContainer {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .share-url-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      word-break: break-all;
      text-align: center;
      user-select: all;
    }

    .copy-link-btn {
      width: 100%;
      background: #4facfe;
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .copy-link-btn:hover {
      background: #00f2fe;
    }

    .playlist-wrapper {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: 320px;
      max-height: calc(100vh - 40px);
    }

    .playlist-btn-container {
      width: 120px;
      height: 40px;
      background-color: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: width 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    .playlist-btn-container.expanded {
      width: 320px;
      background-color: rgba(0, 0, 0, 0.85);
      border-color: #4facfe;
    }

    .playlist-btn-container.error-shake {
      animation: shake 0.4s ease-in-out;
      border-color: #ff4d4d !important;
      background-color: rgba(255, 0, 0, 0.4) !important;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    .btn-label {
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      user-select: none;
    }

    .url-input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      padding: 0 15px;
      font-size: 14px;
      display: none;
    }

    .playlist-btn-container.expanded .btn-label {
      display: none;
    }

    .playlist-btn-container.expanded .url-input {
      display: block;
    }

    .song-list {
      margin-top: 15px;
      width: 100%;
      max-height: calc(100vh - 100px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }

    .song-list::-webkit-scrollbar, .subtitle-menu::-webkit-scrollbar, .feature-menu::-webkit-scrollbar, .history-list::-webkit-scrollbar {
      width: 6px;
    }
    .song-list::-webkit-scrollbar-track, .subtitle-menu::-webkit-scrollbar-track, .feature-menu::-webkit-scrollbar-track, .history-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }
    .song-list::-webkit-scrollbar-thumb, .subtitle-menu::-webkit-scrollbar-thumb, .feature-menu::-webkit-scrollbar-thumb, .history-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .song-item-wrapper {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: transparent;
      transition: background-color 0.3s ease;
      flex-shrink: 0;
    }

    .song-item-wrapper.last-song-warning {
      background: rgba(255, 0, 0, 0.85);
      animation: flashWarning 0.4s ease-in-out;
    }

    .song-item-wrapper.deleting {
      background: rgba(255, 0, 0, 0.8);
    }

    @keyframes flashWarning {
      0%, 100% { background-color: rgba(255, 0, 0, 0.2); }
      50% { background-color: rgba(255, 0, 0, 1); }
    }

    .delete-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      padding-left: 15px;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .song-item-wrapper.active-drag .delete-background {
      opacity: 1;
    }

    .song-item {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      overflow: hidden;
      white-space: nowrap;
      border-left: 3px solid #4facfe;
      position: relative;
      z-index: 2;
      cursor: grab;
      user-select: none;
      touch-action: pan-y;
    }

    .song-item:active {
      cursor: grabbing;
    }

    .marquee {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
      animation: marquee 10s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    .bottom-container {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-bottom: 10px;
      position: relative;
      z-index: 6;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
    }

    .bottom-container.auto-hidden {
      transform: translateY(120px);
      opacity: 0;
      pointer-events: none;
    }

    .control-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background-color: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 12px 24px;
      width: fit-content;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      user-select: none;
    }

    .timeline-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .time-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 280px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .time-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4facfe;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .buttons-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #fff;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: #4facfe;
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn.active {
      background: rgba(79, 172, 254, 0.4);
      border-color: #4facfe;
    }

    .mobile-playlist-modal {
      position: absolute;
      top: 70px;
      right: 12px;
      width: calc(100vw - 24px);
      max-width: 320px;
      max-height: 50vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .mobile-playlist-modal.active {
      display: flex;
    }

    .modal-header {
      font-size: 13px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.7);
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media screen and (max-width: 768px) {
      .ui-layer { padding: 12px; }
      .header-title-container { max-width: calc(100vw - 140px); }
      .header-title-wrapper { padding: 6px 12px; }
      .header-title { font-size: 13px; }
      .playlist-wrapper { top: 12px; right: 12px; width: auto; }
      .playlist-btn-container { width: 105px; height: 36px; }
      .playlist-btn-container.expanded { width: calc(100vw - 24px); max-width: 300px; }
      .song-list { display: none !important; }
      .control-bar { width: 100%; padding: 10px 14px; border-radius: 14px; gap: 8px; }
      .time-slider { width: 100%; flex-grow: 1; }
      .timeline-container { width: 100%; justify-content: space-between; gap: 8px; }
      .buttons-container { width: 100%; justify-content: space-between; flex-wrap: wrap; }
      .control-btn { flex: 1 1 21%; min-width: 60px; padding: 8px 4px; font-size: 12px; text-align: center; }
      .subtitle-menu, .feature-menu { bottom: 125px; right: 12px; width: calc(100vw - 24px); max-width: 240px; }
      .history-modal, .share-modal { bottom: 125px; left: 12px; width: calc(100vw - 24px); max-width: 300px; }
    }
  </style>
</head>
<body id="app-body">

  <div id="player-container">
    <div id="player"></div>
  </div>

  <div class="ui-layer" id="uiLayer">
    <div class="header-title-container">
      <div class="header-title-wrapper">
        <div class="header-title" id="headerTitle">Qimei Music Web</div>
      </div>
      <div class="sync-indicator" id="syncIndicator" title="雲端同步狀態"></div>
    </div>

    <div class="playlist-wrapper">
      <div class="playlist-btn-container" id="inputContainer">
        <span class="btn-label" id="playlistBtnLabel">播放列表</span>
        <input type="text" class="url-input" id="urlInput" placeholder="請輸入YT連結 (Enter送出)">
      </div>

      <div class="song-list" id="songList"></div>

      <div class="mobile-playlist-modal" id="mobilePlaylistModal">
        <div class="modal-header">
          <span>播放清單管理</span>
          <span style="font-size: 11px; color: #4facfe;">向右滑動可刪除</span>
        </div>
        <div class="song-list" id="mobileSongList" style="display: flex !important; max-height: 40vh;"></div>
      </div>
    </div>

    <!-- 底部專屬隱形感應區塊 -->
    <div class="bottom-detector" id="bottomDetector"></div>

    <div class="bottom-container" id="bottomContainer">
      <!-- 歷史播放清單彈窗 -->
      <div class="history-modal" id="historyModal">
        <div class="modal-header">
          <span>歷史播放紀錄 (本次工作階段)</span>
          <span style="font-size: 11px; color: #4facfe; cursor: pointer;" id="closeHistory">關閉</span>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>

      <!-- 分享遙控器彈窗 -->
      <div class="share-modal" id="shareModal">
        <div class="modal-header">
          <span>手機遙控器分享</span>
          <span style="font-size: 11px; color: #4facfe; cursor: pointer;" id="closeShare">關閉</span>
        </div>
        <div class="share-content">
          <div id="qrcodeContainer"></div>
          <div class="share-url-box" id="shareUrlText"></div>
          <button class="copy-link-btn" id="copyLinkBtn">複製遙控連結</button>
        </div>
      </div>

      <div class="feature-menu" id="featureMenu">
        <button class="feature-option" id="autoHideBtn">自動隱藏介面: 關閉</button>
        <button class="feature-option" id="historyBtn">歷史播放清單</button>
        <button class="feature-option" id="shareBtn">分享遙控器 QR Code</button>
      </div>
      <div class="subtitle-menu" id="subtitleMenu"></div>

      <div class="control-bar">
        <div class="timeline-container">
          <span id="currentTime">00:00</span>
          <input type="range" id="timeSlider" class="time-slider" value="0" min="0" max="100" step="0.1">
          <span id="durationTime">00:00</span>
        </div>
        <div class="buttons-container">
          <button class="control-btn" id="playPauseBtn">暫停</button>
          <button class="control-btn" id="skipBtn">切歌</button>
          <button class="control-btn" id="speedBtn">1.0x</button>
          <button class="control-btn" id="featureBtn">功能</button>
          <button class="control-btn" id="subtitleBtn">字幕</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || 'default_room';

    const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const WS_URL = wsProtocol + window.location.host + '/ws?room=' + encodeURIComponent(room);
    let ws = null;

    let player;
    let playlist = [];
    let playHistory = [];
    let isPlaying = true;
    let isApiReady = false;
    let isUserDraggingSlider = false;
    let isSubtitleActive = false;
    let timeUpdateInterval = null;
    let currentSpeed = 1.0;
    const speeds = [1.0, 1.25, 1.5, 2.0, 0.5];

    let isAutoHiderEnabled = false;
    let autoHideTimer = null;
    const AUTO_HIDE_DELAY = 3000;

    const languageMap = {
      'zh-Hant': '繁體中文', 'zh-Hans': '簡體中文', 'zh-TW': '繁體中文 (台灣)',
      'zh-CN': '簡體中文 (中國)', 'zh-HK': '繁體中文 (香港)', 'zh': '中文',
      'en': '英文', 'en-US': '英文 (美國)', 'en-GB': '英文 (英國)',
      'ja': '日文', 'ko': '韓文', 'es': '西班牙文', 'fr': '法文',
      'de': '德文', 'ru': '俄文', 'vi': '越南文', 'th': '泰文', 'id': '印尼文'
    };

    const urlInput = document.getElementById('urlInput');
    const inputContainer = document.getElementById('inputContainer');
    const playlistBtnLabel = document.getElementById('playlistBtnLabel');
    const headerTitle = document.getElementById('headerTitle');
    const syncIndicator = document.getElementById('syncIndicator');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const skipBtn = document.getElementById('skipBtn');
    const speedBtn = document.getElementById('speedBtn');
    const featureBtn = document.getElementById('featureBtn');
    const featureMenu = document.getElementById('featureMenu');
    const autoHideBtn = document.getElementById('autoHideBtn');
    const historyBtn = document.getElementById('historyBtn');
    const historyModal = document.getElementById('historyModal');
    const historyList = document.getElementById('historyList');
    const closeHistory = document.getElementById('closeHistory');
    
    // 分享面板相關元素
    const shareBtn = document.getElementById('shareBtn');
    const shareModal = document.getElementById('shareModal');
    const closeShare = document.getElementById('closeShare');
    const qrcodeContainer = document.getElementById('qrcodeContainer');
    const shareUrlText = document.getElementById('shareUrlText');
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    let qrCodeInstance = null;

    const subtitleBtn = document.getElementById('subtitleBtn');

    function initWebSocket() {
      syncIndicator.classList.remove('connected');
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        syncIndicator.classList.add('connected');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.action === 'SYNC_STATE') {
            if (data.playlist) {
              const oldFirstId = playlist.length > 0 ? playlist[0].id : null;
              playlist = data.playlist;
              playHistory = data.history || [];
              updatePlaylistUI();

              if (playlist.length > 0) {
                if (playlist[0].id !== oldFirstId) checkAndPlayNext();
              } else {
                if (player && isApiReady && typeof player.stopVideo === 'function') player.stopVideo();
                updateTitleDisplay('Qimei Music Web (' + room + ')');
                playlistBtnLabel.textContent = '播放列表';
              }
            }

            if (data.playerState) {
              applyPlayerState(data.playerState);
            }
          } 
          else if (data.action === 'REMOTE_CMD') {
            handleRemoteCommand(data.command);
          } 
          else if (data.action === 'SEEK_TIME') {
            if (player && isApiReady && typeof player.getDuration === 'function') {
              player.seekTo((data.percent / 100) * player.getDuration(), true);
            }
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        syncIndicator.classList.remove('connected');
        setTimeout(initWebSocket, 3000);
      };
    }

    function applyPlayerState(state) {
      if (typeof state.isPlaying === 'boolean' && player && isApiReady) {
        isPlaying = state.isPlaying;
        playPauseBtn.textContent = isPlaying ? '暫停' : '播放';
        if (isPlaying) player.playVideo(); else player.pauseVideo();
      }
      if (typeof state.speed === 'number' && player && isApiReady) {
        currentSpeed = state.speed;
        speedBtn.textContent = currentSpeed + 'x';
        player.setPlaybackRate(currentSpeed);
      }
      if (typeof state.isSubtitleActive === 'boolean' && isSubtitleActive !== state.isSubtitleActive) {
        isSubtitleActive = state.isSubtitleActive;
        updateSubtitleUIState();
      }
      if (typeof state.isAutoHiderEnabled === 'boolean' && isAutoHiderEnabled !== state.isAutoHiderEnabled) {
        isAutoHiderEnabled = state.isAutoHiderEnabled;
        autoHideBtn.textContent = isAutoHiderEnabled ? '自動隱藏介面: 開啟' : '自動隱藏介面: 關閉';
        autoHideBtn.classList.toggle('active-state', isAutoHiderEnabled);
        if (!isAutoHiderEnabled) bottomContainer.classList.remove('auto-hidden');
      }
    }

    function broadcastPlayerState() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          action: 'UPDATE_PLAYER_STATE',
          state: {
            isPlaying: isPlaying,
            speed: currentSpeed,
            isSubtitleActive: isSubtitleActive,
            isAutoHiderEnabled: isAutoHiderEnabled
          }
        }));
      }
    }

    function handleRemoteCommand(cmd) {
      if (cmd === 'togglePlay') togglePlayPause(true);
      if (cmd === 'skip') skipToNextSong();
      if (cmd === 'speed') cyclePlaybackSpeed(true);
      if (cmd === 'subtitle') toggleSubtitleMode(true);
      if (cmd === 'autohide') {
        isAutoHiderEnabled = !isAutoHiderEnabled;
        autoHideBtn.textContent = isAutoHiderEnabled ? '自動隱藏介面: 開啟' : '自動隱藏介面: 關閉';
        autoHideBtn.classList.toggle('active-state', isAutoHiderEnabled);
        if (!isAutoHiderEnabled) bottomContainer.classList.remove('auto-hidden');
        broadcastPlayerState();
      }
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          'autoplay': 1, 'controls': 0, 'disablekb': 1, 'fs': 0,
          'modestbranding': 1, 'rel': 0, 'playsinline': 1, 'cc_load_policy': 0, 'enablejsapi': 1
        },
        events: {
          'onReady': () => {
            isApiReady = true;
            initWebSocket();
            checkAndPlayNext();
            startTimeTracker();
            isSubtitleActive = false;
            updateSubtitleUIState();
            if (player && typeof player.unloadModule === 'function') {
              player.unloadModule('captions');
            }
          },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.ENDED) {
              skipToNextSong();
            } else if (e.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              playPauseBtn.textContent = '暫停';
              if (!isSubtitleActive && player && typeof player.unloadModule === 'function') {
                player.unloadModule('captions');
              }
            } else if (e.data === YT.PlayerState.PAUSED) {
              isPlaying = false;
              playPauseBtn.textContent = '播放';
            }
          },
          'onError': () => {
            triggerErrorAnimation();
            skipToNextSong();
          }
        }
      });
    }

    function skipToNextSong() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'moveToHistory' }));
      }
    }

    function checkAndPlayNext() {
      if (playlist.length > 0 && isApiReady && player && typeof player.loadVideoById === 'function') {
        isPlaying = true;

        const curData = player.getVideoData ? player.getVideoData() : null;
        if (!curData || curData.video_id !== playlist[0].id) {
          player.loadVideoById(playlist[0].id);

        updateCurrentSongDisplay();

    function normalizeLangCode(code) {
      if (!code) return '';
      return String(code).toLowerCase().replace(/_/g, '-').trim();

    function openSubtitleLanguageMenu() {
      if (!player || !isApiReady || typeof player.getOptions !== 'function') return;
      subtitleMenu.innerHTML = '';

    function startTimeTracker() {
      if (timeUpdateInterval) clearInterval(timeUpdateInterval);
      timeUpdateInterval = setInterval(() => {
        if (player && isApiReady && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
          const currentTime = player.getCurrentTime() || 0;
          const duration = player.getDuration() || 0;
          currentTimeEl.textContent = formatTime(currentTime);
          durationTimeEl.textContent = formatTime(duration);
          if (!isUserDraggingSlider && duration > 0) {
            timeSlider.value = (currentTime / duration) * 100;
          }

          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'SYNC_TIME', currentTime, duration }));

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function expandInput() {
      inputContainer.classList.add('expanded');

    function collapseInput() {
      inputContainer.classList.remove('expanded');

      urlInput.blur();

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function fetchVideoDetails(videoId) {
      let title = `YouTube Track (${videoId})`;
      let durationStr = '03:30';

      try {
        const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
        if (res.ok) {
          const data = await res.json();
          if (data.title) title = data.title;
        }
      } catch (e) {}

      if (title === `YouTube Track (${videoId})`) {
        try {
          const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
          if (res.ok) {
            const data = await res.json();
            if (data.title) title = data.title;
          }
        } catch (e) {}
      }

      durationStr = await fetchDurationInBackground(videoId);
      return { title, durationStr };
    }

    function fetchDurationInBackground(videoId) {
      return new Promise((resolve) => {
        if (player && isApiReady && typeof player.getDuration === 'function' && playlist.length > 0 && playlist[0].id === videoId) {
          const d = player.getDuration();
          if (d > 0) {
            resolve(formatTime(d));
            return;
          }
        }

        const tempDivId = 'temp_duration_getter_' + Date.now();
        const div = document.createElement('div');
        div.id = tempDivId;
        div.style.display = 'none';
        document.body.appendChild(div);

        let tempPlayer;
        let resolved = false;

        const cleanup = () => {
          if (!resolved) {
            resolved = true;
            try {
              if (tempPlayer && typeof tempPlayer.destroy === 'function') tempPlayer.destroy();
            } catch (err) {}
            if (div.parentNode) div.parentNode.removeChild(div);
            resolve('03:30');
          }
        };

        const timeoutTimer = setTimeout(cleanup, 5000);

        try {
          tempPlayer = new YT.Player(tempDivId, {
            height: '1',
            width: '1',
            videoId: videoId,
            playerVars: { 'autoplay': 0, 'controls': 0 },
            events: {
              'onReady': (event) => {
                try {
                  const dur = event.target.getDuration();
                  if (dur && dur > 0) {
                    if (!resolved) {
                      resolved = true;
                      clearTimeout(timeoutTimer);
                      const formatted = formatTime(dur);
                      try { event.target.destroy(); } catch (e) {}
                      if (div.parentNode) div.parentNode.removeChild(div);
                      resolve(formatted);
                    }
                  } else {
                    setTimeout(() => {
                      try {
                        const d2 = event.target.getDuration();
                        if (!resolved) {
                          resolved = true;
                          clearTimeout(timeoutTimer);
                          const formatted2 = (d2 && d2 > 0) ? formatTime(d2) : '03:30';
                          try { event.target.destroy(); } catch (e) {}
                          if (div.parentNode) div.parentNode.removeChild(div);
                          resolve(formatted2);
                        }
                      } catch (err) {
                        cleanup();
                      }
                    }, 1000);
                  }
                } catch (err) {
                  cleanup();
                }
              },
              'onError': () => {
                clearTimeout(timeoutTimer);
                cleanup();
              }
            }
          });
        } catch (e) {
          clearTimeout(timeoutTimer);
          cleanup();
        }
      });
    }

    async function processYouTubeUrl(url) {
      const videoId = extractVideoId(url);
      if (!videoId) {
        triggerErrorAnimation();
        return;
      }

      const { title: videoTitle, durationStr } = await fetchVideoDetails(videoId);
      collapseInput();

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          action: 'addSong',
          song: {
            id: videoId,
            title: videoTitle,
            videoDuration: durationStr
          }
        }));
      }
    }

    function renderHistoryUI() {
      historyList.innerHTML = '';
      if (playHistory.length === 0) {
        const emptyItem = document.createElement('div');
        emptyItem.className = 'history-item';
        emptyItem.style.textAlign = 'center';
        emptyItem.style.color = 'rgba(255,255,255,0.4)';
        emptyItem.textContent = '目前尚無點歌紀錄';
        historyList.appendChild(emptyItem);
        return;
      }

      playHistory.forEach(item => {
        const historyEl = document.createElement('div');
        historyEl.className = 'history-item';
        historyEl.innerHTML = `
          <div class="history-title">${item.title}</div>
          <div class="history-info">
            <span>點歌時間: ${item.requestTime}</span>
            <span>影片時長: ${item.videoDuration}</span>
          </div>
        `;
        historyEl.onclick = () => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              action: 'addSong',
              song: {
                id: item.id,
                title: item.title,
                videoDuration: item.videoDuration || '03:30'
              }
            }));
          }
          historyModal.classList.remove('active');
        };
        historyList.appendChild(historyEl);
      });
    }

    function triggerErrorAnimation() {
      inputContainer.classList.add('error-shake');
      setTimeout(() => inputContainer.classList.remove('error-shake'), 500);
    }

    function updatePlaylistUI() {
      updateCurrentSongDisplay();
      renderListToContainer(document.getElementById('songList'));
      renderListToContainer(document.getElementById('mobileSongList'));
    }

    function renderListToContainer(containerEl) {
      if (!containerEl) return;
      containerEl.innerHTML = '';

      playlist.forEach((song, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'song-item-wrapper';

        const deleteBg = document.createElement('div');
        deleteBg.className = 'delete-background';
        deleteBg.textContent = playlist.length === 1 ? '⚠️ 這是最後一首了' : '🗑️ 刪除';
        wrapper.appendChild(deleteBg);

        const item = document.createElement('div');
        item.className = 'song-item';

        const prefix = index === 0 ? '▶ ' : `${index + 1}. `;
        const fullText = prefix + song.title;

        if (fullText.length > 20) {
          item.innerHTML = `<div class="marquee">${fullText}&nbsp;&nbsp;&nbsp;&nbsp;${fullText}</div>`;
        } else {
          item.textContent = fullText;
        }

        wrapper.appendChild(item);
        containerEl.appendChild(wrapper);

        initSwipeToDelete(item, wrapper, index);
      });
    }

    function initSwipeToDelete(itemEl, wrapperEl, index) {
      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      function onStart(clientX) {
        isDragging = true;
        startX = clientX;
        itemEl.style.transition = 'none';
        wrapperEl.classList.add('active-drag');
        if (playlist.length > 1) wrapperEl.classList.add('deleting');
      }

      function onMove(clientX) {
        if (!isDragging) return;
        currentX = clientX - startX;
        if (currentX > 0) {
          itemEl.style.transform = `translateX(${currentX}px)`;
        } else {
          itemEl.style.transform = `translateX(0px)`;
        }
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        itemEl.style.transform = 'transform 0.3s ease';
        wrapperEl.classList.remove('active-drag', 'deleting');

        if (playlist.length === 1 && currentX > 80) {
          itemEl.style.transform = `translateX(0px)`;
          wrapperEl.classList.add('last-song-warning');
          setTimeout(() => wrapperEl.classList.remove('last-song-warning'), 400);
        } else if (playlist.length > 1 && currentX > 120) {
          itemEl.style.transform = `translateX(100%)`;
          setTimeout(() => removeSongAtIndex(index), 250);
        } else {
          itemEl.style.transform = `translateX(0px)`;
        }
        currentX = 0;
      }

      itemEl.addEventListener('mousedown', (e) => {
        onStart(e.clientX);
        const mm = (me) => onMove(me.clientX);
        const mu = () => {
          onEnd();
          window.removeEventListener('mousemove', mm);
          window.removeEventListener('mouseup', mu);
        };
        window.addEventListener('mousemove', mm);
        window.addEventListener('mouseup', mu);
      });

      itemEl.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX), { passive: true });
      itemEl.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
      itemEl.addEventListener('touchend', () => onEnd());
    }

    function removeSongAtIndex(index) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        if (index === 0) {
          ws.send(JSON.stringify({ action: 'moveToHistory' }));
        } else {
          ws.send(JSON.stringify({ action: 'removeSong', index: index }));
        }
      }
    }
  </script>
</body>
</html>
