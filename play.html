<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qimei Music Web (Cloud Sync)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, "Microsoft JhengHei", sans-serif; color: #fff; }
    #player-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100vw; height: 100vh; z-index: 1; background-color: #000; transition: all 0.6s ease; }
    #player-container.subtitle-active { width: 75vw; height: 65vh; border-radius: 16px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8); }
    #player { width: 100%; height: 100%; border: none; }
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
    .ui-layer * { pointer-events: auto; }
    .bottom-detector { position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; z-index: 5; background: transparent; }
    .header-title-container { display: flex; align-items: center; gap: 10px; width: fit-content; }
    .header-title { font-size: 16px; font-weight: bold; background-color: rgba(0, 0, 0, 0.55); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 20px; padding: 10px 20px; }
    
    /* 狀態燈號：預設紅燈，連線綠燈，若是 Master 則改為藍色 */
    .sync-indicator { width: 10px; height: 10px; border-radius: 50%; background-color: #ef4444; box-shadow: 0 0 8px #ef4444; transition: all 0.3s; }
    .sync-indicator.connected { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .sync-indicator.master { background-color: #3b82f6; box-shadow: 0 0 10px #3b82f6; }

    .playlist-wrapper { position: absolute; top: 20px; right: 20px; width: 320px; display: flex; flex-direction: column; align-items: flex-end; }
    .playlist-btn-container { width: 120px; height: 40px; background-color: rgba(0, 0, 0, 0.55); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .playlist-btn-container.expanded { width: 320px; background-color: rgba(0, 0, 0, 0.85); border-color: #4facfe; }
    .url-input { width: 100%; height: 100%; background: transparent; border: none; outline: none; color: #fff; padding: 0 15px; display: none; font-size: 14px; }
    .playlist-btn-container.expanded .btn-label { display: none; }
    .playlist-btn-container.expanded .url-input { display: block; }
    .song-list { margin-top: 15px; width: 100%; max-height: calc(100vh - 100px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .song-item { background: rgba(0, 0, 0, 0.85); border-radius: 8px; padding: 8px 12px; font-size: 14px; border-left: 3px solid #4facfe; }
    .bottom-container { display: flex; justify-content: center; width: 100%; margin-bottom: 10px; z-index: 6; transition: transform 0.4s ease, opacity 0.4s ease; }
    .bottom-container.auto-hidden { transform: translateY(120px); opacity: 0; pointer-events: none; }
    .control-bar { display: flex; gap: 10px; background-color: rgba(0, 0, 0, 0.55); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 16px; padding: 12px 24px; align-items: center; }
  </style>
</head>
<body>
  <div id="player-container"><div id="player"></div></div>
  <div class="ui-layer">
    <div class="header-title-container">
      <div class="header-title" id="headerTitle">Qimei Music Web</div>
      <div class="sync-indicator" id="syncIndicator" title="連線與身分狀態"></div>
    </div>
    <div class="playlist-wrapper">
      <div class="playlist-btn-container" id="inputContainer">
        <span class="btn-label" id="playlistBtnLabel">播放列表</span>
        <input type="text" class="url-input" id="urlInput" placeholder="請輸入YT連結 (Enter送出)">
      </div>
      <div class="song-list" id="songList"></div>
    </div>
    <div class="bottom-detector" id="bottomDetector"></div>
  </div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const WS_URL = wsProtocol + window.location.host + '/ws';
    let ws = null;
    let myIsMaster = false;
    let player, playlist = [], isApiReady = false;

    const syncIndicator = document.getElementById('syncIndicator');
    const headerTitle = document.getElementById('headerTitle');
    const inputContainer = document.getElementById('inputContainer');
    const urlInput = document.getElementById('urlInput');

    inputContainer.onclick = () => { inputContainer.classList.add('expanded'); urlInput.focus(); };
    urlInput.onkeydown = async (e) => {
      if (e.key === 'Enter' && urlInput.value.trim()) {
        const videoId = extractVideoId(urlInput.value.trim());
        if (videoId) {
          const title = await fetchVideoTitle(videoId);
          ws.send(JSON.stringify({ action: 'addSong', song: { id: videoId, title } }));
          urlInput.value = '';
          inputContainer.classList.remove('expanded');
        }
      }
    };

    function initWebSocket() {
      syncIndicator.className = 'sync-indicator';
      ws = new WebSocket(WS_URL);

      ws.onopen = () => { syncIndicator.classList.add('connected'); };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.action === 'INIT_ROLE') {
            myIsMaster = data.isMaster;
            if (myIsMaster) {
              syncIndicator.classList.add('master'); // Master 燈號改為藍色
            }
          }

          if (data.action === 'SYNC_STATE' || data.playlist) {
            playlist = data.playlist || [];
            updatePlaylistUI();
            checkAndPlayNext();
          }

          // 接收來自控制端的遙控指令
          if (data.action === 'REMOTE_CMD') {
            handleRemoteCommand(data.command);
          }

          // 接收來自控制端的時間軸快轉百分比
          if (data.action === 'SEEK_TIME' && player && isApiReady && typeof player.getDuration === 'function') {
            const targetTime = (data.percent / 100) * player.getDuration();
            player.seekTo(targetTime, true);
          }

          // 跟播端秒數校正 (1.5秒緩衝)
          if (data.action === 'SYNC_TIME' && !myIsMaster && player && isApiReady && typeof player.getCurrentTime === 'function') {
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
              if (Math.abs(player.getCurrentTime() - data.currentTime) > 1.5) {
                player.seekTo(data.currentTime, true);
              }
            }
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        syncIndicator.className = 'sync-indicator';
        setTimeout(initWebSocket, 3000);
      };
    }

    function handleRemoteCommand(cmd) {
      if (!player || !isApiReady) return;
      if (cmd === 'togglePlay') {
        if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
        else player.playVideo();
      } else if (cmd === 'skip') {
        if (myIsMaster) ws.send(JSON.stringify({ action: 'moveToHistory' }));
      } else if (cmd === 'speed') {
        // 可擴充倍速
      }
    }

    function extractVideoId(url) {
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function fetchVideoTitle(videoId) {
      try {
        const res = await fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v=' + videoId);
        const data = await res.json();
        return data.title || ('Track ' + videoId);
      } catch (e) { return 'Track ' + videoId; }
    }

    function updatePlaylistUI() {
      const songList = document.getElementById('songList');
      songList.innerHTML = '';
      playlist.forEach((song, i) => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.textContent = (i === 0 ? '▶ ' : (i + 1) + '. ') + song.title;
        songList.appendChild(item);
      });
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        host: 'https://www.youtube-nocookie.com',
        playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'enablejsapi': 1 },
        events: {
          'onReady': () => { isApiReady = true; initWebSocket(); startProgressTracker(); },
          'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED && myIsMaster) ws.send(JSON.stringify({ action: 'moveToHistory' })); }
        }
      });
    }

    // Master 每 500ms 廣播一次目前進度給所有裝置與控制端
    function startProgressTracker() {
      setInterval(() => {
        if (myIsMaster && player && isApiReady && typeof player.getCurrentTime === 'function') {
          const cur = player.getCurrentTime() || 0;
          const dur = player.getDuration() || 1;
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'SYNC_TIME', currentTime: cur, duration: dur }));
          }
        }
      }, 500);
    }

    function checkAndPlayNext() {
      if (playlist.length > 0 && isApiReady && player && typeof player.loadVideoById === 'function') {
        const curData = player.getVideoData ? player.getVideoData() : null;
        if (!curData || curData.video_id !== playlist[0].id) {
          player.loadVideoById(playlist[0].id);
          player.playVideo();
          headerTitle.textContent = playlist[0].title;
        }
      }
    }
  </script>
</body>
</html>
