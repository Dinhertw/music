<!DOCTYPE html>
<html lang="zh-Hant" class="w-full h-full overflow-hidden bg-black font-sans text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qimei Music Web (Cloud Sync)</title>
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- 引入 QR Code 生成套件 qrcodejs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .marquee {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
      animation: marquee 10s linear infinite;
    }
    @keyframes headerMarquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    .header-title.marquee-enabled {
      display: inline-block;
      white-space: nowrap;
      animation: headerMarquee 12s linear infinite;
      padding-left: 100%;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .error-shake {
      animation: shake 0.4s ease-in-out;
      border-color: #ef4444 !important;
      background-color: rgba(239, 68, 68, 0.4) !important;
    }
  </style>
</head>
<body id="app-body" class="w-full h-full overflow-hidden bg-black font-sans text-white select-none">

  <!-- 播放器本體容器 -->
  <div id="player-container" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-screen h-screen z-10 rounded-none overflow-hidden bg-black transition-all duration-600 ease-[cubic-bezier(0.25,1,0.5,1)]">
    <div id="player" class="w-full h-full border-none pointer-events-auto"></div>
  </div>

  <!-- UI 介面層 -->
  <div class="absolute top-0 left-0 w-full h-full z-40 p-5 flex flex-col justify-between pointer-events-none transition-opacity duration-400 [&_*]:pointer-events-auto" id="uiLayer">
    
    <!-- 頂部標題與同步指示燈 -->
    <div class="flex items-center gap-2.5 w-fit max-w-[calc(100vw-360px)] md:max-w-[calc(100vw-140px)]">
      <div class="bg-black/55 backdrop-blur-md border border-white/25 rounded-full px-5 py-2.5 shadow-lg shadow-black/40 text-shadow max-w-full overflow-hidden whitespace-nowrap md:px-3 md:py-1.5">
        <div class="text-base font-bold tracking-wider inline-block text-white md:text-[13px]" id="headerTitle">Qimei Music Web</div>
      </div>
      <div class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)] transition-all duration-300 shrink-0" id="syncIndicator" title="雲端同步狀態"></div>
    </div>

    <!-- 右上角播放列表區塊 -->
    <div class="absolute top-5 right-5 flex flex-col items-end w-80 max-h-[calc(100vh-40px)] md:top-3 md:right-3 md:w-auto">
      <div class="w-[120px] h-10 bg-black/55 backdrop-blur-md border border-white/25 rounded-full flex items-center justify-center overflow-hidden transition-all duration-300 cursor-pointer shadow-lg shadow-black/40 shrink-0 md:w-[105px] md:h-[9px]" id="inputContainer">
        <span class="text-base font-bold text-shadow whitespace-nowrap" id="playlistBtnLabel">播放列表</span>
        <input type="text" class="w-full h-full bg-transparent border-none outline-none text-white px-4 text-sm hidden" id="urlInput" placeholder="請輸入YT連結 (Enter送出)">
      </div>

      <div class="mt-3.5 w-full max-h-[calc(100vh-100px)] flex flex-col gap-2 overflow-y-auto overflow-x-hidden pr-1 md:hidden [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-white/5 [&::-webkit-scrollbar-track]:rounded-sm [&::-webkit-scrollbar-thumb]:bg-white/20 [&::-webkit-scrollbar-thumb]:rounded-sm" id="songList"></div>

      <!-- 手機版播放清單彈窗 (Tailwind 風格) -->
      <div class="absolute top-[70px] right-3 w-[calc(100vw-24px)] max-w-[320px] max-h-[50vh] bg-black/90 backdrop-blur-xl border border-white/30 rounded-2xl p-3.5 hidden flex-col gap-2 z-20 shadow-2xl shadow-black/70" id="mobilePlaylistModal">
        <div class="text-xs font-bold text-white/70 pb-1 border-b border-white/15 flex justify-between items-center">
          <span>播放清單管理</span>
          <span class="text-[11px] text-sky-400">向右滑動可刪除</span>
        </div>
        <div class="flex flex-col gap-2 overflow-y-auto overflow-x-hidden pr-1 max-h-[40vh] [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-white/5 [&::-webkit-scrollbar-track]:rounded-sm [&::-webkit-scrollbar-thumb]:bg-white/20 [&::-webkit-scrollbar-thumb]:rounded-sm" id="mobileSongList" style="display: flex !important;"></div>
      </div>
    </div>

    <!-- 底部專屬隱形感應區塊 -->
    <div class="absolute bottom-0 left-0 w-full h-[150px] z-5 pointer-events-auto bg-transparent" id="bottomDetector"></div>

    <!-- 底部控制列與選單 -->
    <div class="flex justify-center w-full mb-2.5 relative z-6 transition-all duration-400 ease-[cubic-bezier(0.25,1,0.5,1)]" id="bottomContainer">
      
      <!-- 歷史播放清單彈窗 (Tailwind 風格) -->
      <div class="absolute bottom-[130px] left-5 w-80 bg-black/90 backdrop-blur-xl border border-white/30 rounded-2xl p-3.5 hidden flex-col gap-2.5 z-25 shadow-2xl shadow-black/70 md:bottom-[125px] md:left-3 md:w-[calc(100vw-24px)] md:max-w-[300px]" id="historyModal">
        <div class="text-xs font-bold text-white/70 pb-1 border-b border-white/15 flex justify-between items-center">
          <span>歷史播放紀錄 (本次工作階段)</span>
          <span class="text-[11px] text-sky-400 cursor-pointer hover:underline" id="closeHistory">關閉</span>
        </div>
        <div class="flex flex-col gap-1.5 max-h-[280px] overflow-y-auto overflow-x-hidden pr-1 [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-white/5 [&::-webkit-scrollbar-track]:rounded-sm [&::-webkit-scrollbar-thumb]:bg-white/20 [&::-webkit-scrollbar-thumb]:rounded-sm" id="historyList"></div>
      </div>

      <!-- 手機遙控器分享彈窗 (Tailwind 風格) -->
      <div class="absolute bottom-[130px] left-5 w-80 bg-black/90 backdrop-blur-xl border border-white/30 rounded-2xl p-3.5 hidden flex-col gap-3 z-25 shadow-2xl shadow-black/70 md:bottom-[125px] md:left-3 md:w-[calc(100vw-24px)] md:max-w-[300px]" id="shareModal">
        <div class="text-xs font-bold text-white/70 pb-1 border-b border-white/15 flex justify-between items-center">
          <span>手機遙控器分享</span>
          <span class="text-[11px] text-sky-400 cursor-pointer hover:underline" id="closeShare">關閉</span>
        </div>
        <div class="flex flex-col items-center gap-3 py-1">
          <div id="qrcodeContainer" class="bg-white p-2.5 rounded-lg flex justify-center items-center"></div>
          <div class="w-full bg-white/10 border border-white/20 rounded-md p-2 text-xs text-white/85 break-all text-center select-all" id="shareUrlText"></div>
          <button class="w-full bg-sky-400 hover:bg-sky-300 border-none rounded-md text-black font-bold py-2 text-xs cursor-pointer transition-colors shadow-md" id="copyLinkBtn">複製遙控連結</button>
        </div>
      </div>

      <!-- 功能選單 (Tailwind 風格) -->
      <div class="absolute bottom-[95px] right-[120px] w-60 bg-black/85 backdrop-blur-xl border border-white/30 rounded-xl p-2 hidden flex-col gap-1 z-10 shadow-xl shadow-black/50 md:bottom-[125px] md:right-3 md:w-[calc(100vw-24px)] md:max-w-[240px]" id="featureMenu">
        <button class="bg-transparent border-none text-white px-3 py-2 text-left text-[13px] rounded-md cursor-pointer hover:bg-white/20 hover:text-sky-400 transition-colors whitespace-nowrap overflow-hidden text-ellipsis shrink-0" id="autoHideBtn">自動隱藏介面: 關閉</button>
        <button class="bg-transparent border-none text-white px-3 py-2 text-left text-[13px] rounded-md cursor-pointer hover:bg-white/20 hover:text-sky-400 transition-colors whitespace-nowrap overflow-hidden text-ellipsis shrink-0" id="historyBtn">歷史播放清單</button>
        <button class="bg-transparent border-none text-white px-3 py-2 text-left text-[13px] rounded-md cursor-pointer hover:bg-white/20 hover:text-sky-400 transition-colors whitespace-nowrap overflow-hidden text-ellipsis shrink-0" id="shareBtn">分享遙控器 QR Code</button>
      </div>

      <!-- 字幕選單 (Tailwind 風格) -->
      <div class="absolute bottom-[95px] right-6 w-[190px] max-h-[220px] bg-black/85 backdrop-blur-xl border border-white/30 rounded-xl p-2 hidden flex-col gap-1 overflow-y-auto overflow-x-hidden z-10 shadow-xl shadow-black/50 md:bottom-[125px] md:right-3 md:w-[calc(100vw-24px)] md:max-w-[240px] [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-white/5 [&::-webkit-scrollbar-track]:rounded-sm [&::-webkit-scrollbar-thumb]:bg-white/20 [&::-webkit-scrollbar-thumb]:rounded-sm" id="subtitleMenu"></div>

      <!-- 控制列本體 -->
      <div class="flex flex-col items-center gap-2.5 bg-black/55 backdrop-blur-md border border-white/25 rounded-2xl px-6 py-3 w-fit shadow-lg shadow-black/40 md:w-full md:px-3.5 md:py-2.5 md:rounded-xl md:gap-2">
        <div class="flex items-center gap-3 text-xs text-white/90 text-shadow md:w-full md:justify-between md:gap-2">
          <span id="currentTime">00:00</span>
          <input type="range" id="timeSlider" class="appearance-none w-[280px] h-1 bg-white/30 rounded-full outline-none cursor-pointer md:w-full md:grow [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-2.5 [&::-webkit-slider-thumb]:h-2.5 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-sky-400 [&::-webkit-slider-thumb]:cursor-pointer" value="0" min="0" max="100" step="0.1">
          <span id="durationTime">00:00</span>
        </div>
        <div class="flex items-center gap-2.5 md:w-full md:justify-between md:flex-wrap">
          <button class="bg-white/15 border border-white/25 rounded-lg text-white px-4 py-1.5 text-[13px] font-bold cursor-pointer text-shadow transition-all hover:bg-white/30 hover:border-sky-400 active:scale-95 md:flex-1 md:min-w-[60px] md:px-1 md:py-2 md:text-xs md:text-center" id="playPauseBtn">暫停</button>
          <button class="bg-white/15 border border-white/25 rounded-lg text-white px-4 py-1.5 text-[13px] font-bold cursor-pointer text-shadow transition-all hover:bg-white/30 hover:border-sky-400 active:scale-95 md:flex-1 md:min-w-[60px] md:px-1 md:py-2 md:text-xs md:text-center" id="skipBtn">切歌</button>
          <button class="bg-white/15 border border-white/25 rounded-lg text-white px-4 py-1.5 text-[13px] font-bold cursor-pointer text-shadow transition-all hover:bg-white/30 hover:border-sky-400 active:scale-95 md:flex-1 md:min-w-[60px] md:px-1 md:py-2 md:text-xs md:text-center" id="speedBtn">1.0x</button>
          <button class="bg-white/15 border border-white/25 rounded-lg text-white px-4 py-1.5 text-[13px] font-bold cursor-pointer text-shadow transition-all hover:bg-white/30 hover:border-sky-400 active:scale-95 md:flex-1 md:min-w-[60px] md:px-1 md:py-2 md:text-xs md:text-center" id="featureBtn">功能</button>
          <button class="bg-white/15 border border-white/25 rounded-lg text-white px-4 py-1.5 text-[13px] font-bold cursor-pointer text-shadow transition-all hover:bg-white/30 hover:border-sky-400 active:scale-95 md:flex-1 md:min-w-[60px] md:px-1 md:py-2 md:text-xs md:text-center" id="subtitleBtn">字幕</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || 'default_room';

    const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const WS_URL = wsProtocol + window.location.host + '/ws?room=' + encodeURIComponent(room);
    let ws = null;

    let player;
    let playlist = [];
    let playHistory = [];
    let isPlaying = true;
    let isApiReady = false;
    let isUserDraggingSlider = false;
    let isSubtitleActive = false;
    let timeUpdateInterval = null;
    let currentSpeed = 1.0;
    const speeds = [1.0, 1.25, 1.5, 2.0, 0.5];

    let isAutoHiderEnabled = false;
    let autoHideTimer = null;
    const AUTO_HIDE_DELAY = 3000;

    const languageMap = {
      'zh-Hant': '繁體中文', 'zh-Hans': '簡體中文', 'zh-TW': '繁體中文 (台灣)',
      'zh-CN': '簡體中文 (中國)', 'zh-HK': '繁體中文 (香港)', 'zh': '中文',
      'en': '英文', 'en-US': '英文 (美國)', 'en-GB': '英文 (英國)',
      'ja': '日文', 'ko': '韓文', 'es': '西班牙文', 'fr': '法文',
      'de': '德文', 'ru': '俄文', 'vi': '越南文', 'th': '泰文', 'id': '印尼文'
    };

    const urlInput = document.getElementById('urlInput');
    const inputContainer = document.getElementById('inputContainer');
    const playlistBtnLabel = document.getElementById('playlistBtnLabel');
    const headerTitle = document.getElementById('headerTitle');
    const syncIndicator = document.getElementById('syncIndicator');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const skipBtn = document.getElementById('skipBtn');
    const speedBtn = document.getElementById('speedBtn');
    const featureBtn = document.getElementById('featureBtn');
    const featureMenu = document.getElementById('featureMenu');
    const autoHideBtn = document.getElementById('autoHideBtn');
    const historyBtn = document.getElementById('historyBtn');
    const historyModal = document.getElementById('historyModal');
    const historyList = document.getElementById('historyList');
    const closeHistory = document.getElementById('closeHistory');
    
    const shareBtn = document.getElementById('shareBtn');
    const shareModal = document.getElementById('shareModal');
    const closeShare = document.getElementById('closeShare');
    const qrcodeContainer = document.getElementById('qrcodeContainer');
    const shareUrlText = document.getElementById('shareUrlText');
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    let qrCodeInstance = null;

    const subtitleBtn = document.getElementById('subtitleBtn');
    const subtitleMenu = document.getElementById('subtitleMenu');
    const mobilePlaylistModal = document.getElementById('mobilePlaylistModal');
    const timeSlider = document.getElementById('timeSlider');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const playerContainer = document.getElementById('player-container');
    const bottomContainer = document.getElementById('bottomContainer');
    const bottomDetector = document.getElementById('bottomDetector');

    let playlistPressTimer = null;
    let isPlaylistLongPress = false;
    const isMobileDevice = () => window.innerWidth <= 768;

    inputContainer.addEventListener('mousedown', () => {
      if (inputContainer.classList.contains('expanded')) return;
      isPlaylistLongPress = false;
      playlistPressTimer = setTimeout(() => {
        isPlaylistLongPress = true;
        if (isMobileDevice()) toggleMobilePlaylistModal();
      }, 500);
    });

    inputContainer.addEventListener('touchstart', () => {
      if (inputContainer.classList.contains('expanded')) return;
      isPlaylistLongPress = false;
      playlistPressTimer = setTimeout(() => {
        isPlaylistLongPress = true;
        if (isMobileDevice()) toggleMobilePlaylistModal();
      }, 500);
    }, { passive: true });

    inputContainer.addEventListener('mouseup', () => {
      clearTimeout(playlistPressTimer);
      if (!isPlaylistLongPress && !inputContainer.classList.contains('expanded')) {
        handlePlaylistClickAction();
      }
    });

    inputContainer.addEventListener('touchend', () => {
      clearTimeout(playlistPressTimer);
      if (!isPlaylistLongPress && !inputContainer.classList.contains('expanded')) {
        handlePlaylistClickAction();
      }
    });

    async function handlePlaylistClickAction() {
      expandInput();
      if (navigator.clipboard && navigator.clipboard.readText) {
        try {
          const clipText = await navigator.clipboard.readText();
          if (clipText && extractVideoId(clipText.trim())) {
            urlInput.value = clipText.trim();
            processYouTubeUrl(urlInput.value.trim());
          }
        } catch (err) {}
      }
    }

    function toggleMobilePlaylistModal() {
      mobilePlaylistModal.classList.toggle('flex');
      mobilePlaylistModal.classList.toggle('hidden');
    }

    document.addEventListener('click', (e) => {
      if (!inputContainer.contains(e.target) && !mobilePlaylistModal.contains(e.target)) {
        mobilePlaylistModal.classList.remove('flex');
        mobilePlaylistModal.classList.add('hidden');
      }
    });

    playPauseBtn.onclick = () => togglePlayPause(true);
    skipBtn.onclick = skipToNextSong;
    speedBtn.onclick = () => cyclePlaybackSpeed(true);

    featureBtn.addEventListener('click', () => {
      featureMenu.classList.toggle('flex');
      featureMenu.classList.toggle('hidden');
      subtitleMenu.classList.remove('flex');
      subtitleMenu.classList.add('hidden');
    });

    autoHideBtn.addEventListener('click', () => {
      isAutoHiderEnabled = !isAutoHiderEnabled;
      autoHideBtn.textContent = isAutoHiderEnabled ? '自動隱藏介面: 開啟' : '自動隱藏介面: 關閉';
      autoHideBtn.classList.toggle('text-sky-400', isAutoHiderEnabled);
      autoHideBtn.classList.toggle('font-bold', isAutoHiderEnabled);
      featureMenu.classList.remove('flex');
      featureMenu.classList.add('hidden');
      if (!isAutoHiderEnabled) bottomContainer.classList.remove('auto-hidden');
      broadcastPlayerState();
    });

    historyBtn.addEventListener('click', () => {
      featureMenu.classList.remove('flex');
      featureMenu.classList.add('hidden');
      renderHistoryUI();
      historyModal.classList.toggle('flex');
      historyModal.classList.toggle('hidden');
      shareModal.classList.remove('flex');
      shareModal.classList.add('hidden');
    });

    closeHistory.addEventListener('click', () => {
      historyModal.classList.remove('flex');
      historyModal.classList.add('hidden');
    });

    shareBtn.addEventListener('click', () => {
      featureMenu.classList.remove('flex');
      featureMenu.classList.add('hidden');
      historyModal.classList.remove('flex');
      historyModal.classList.add('hidden');
      shareModal.classList.toggle('flex');
      shareModal.classList.toggle('hidden');

      const controlUrl = `${window.location.origin}/control?room=${encodeURIComponent(room)}`;
      shareUrlText.textContent = controlUrl;

      qrcodeContainer.innerHTML = '';
      qrCodeInstance = new QRCode(qrcodeContainer, {
        text: controlUrl,
        width: 150,
        height: 150,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    });

    closeShare.addEventListener('click', () => {
      shareModal.classList.remove('flex');
      shareModal.classList.add('hidden');
    });

    copyLinkBtn.addEventListener('click', () => {
      const controlUrl = shareUrlText.textContent;
      navigator.clipboard.writeText(controlUrl).then(() => {
        const originalText = copyLinkBtn.textContent;
        copyLinkBtn.textContent = '✅ 複製成功！';
        copyLinkBtn.className = 'w-full bg-green-500 hover:bg-green-400 border-none rounded-md text-white font-bold py-2 text-xs cursor-pointer transition-colors shadow-md';
        setTimeout(() => {
          copyLinkBtn.textContent = originalText;
          copyLinkBtn.className = 'w-full bg-sky-400 hover:bg-sky-300 border-none rounded-md text-black font-bold py-2 text-xs cursor-pointer transition-colors shadow-md';
        }, 2000);
      }).catch(() => {});
    });

    bottomDetector.addEventListener('mouseenter', () => {
      if (!isAutoHiderEnabled) return;
      wakeUpUI();
    });

    bottomDetector.addEventListener('pointerenter', () => {
      if (!isAutoHiderEnabled) return;
      wakeUpUI();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isAutoHiderEnabled) return;
      if (e.clientY >= window.innerHeight - 150) {
        wakeUpUI();
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isAutoHiderEnabled) return;
      if (e.clientY >= window.innerHeight - 150) {
        wakeUpUI();
      }
    });

    window.addEventListener('touchstart', () => {
      wakeUpUI();
    }, { passive: true });

    function wakeUpUI() {
      if (!isAutoHiderEnabled) return;
      bottomContainer.classList.remove('auto-hidden');
      resetAutoHideTimer();
    }

    function resetAutoHideTimer() {
      if (!isAutoHiderEnabled) return;
      if (autoHideTimer) clearTimeout(autoHideTimer);
      autoHideTimer = setTimeout(() => {
        if (featureMenu.classList.contains('flex') || historyModal.classList.contains('flex') || shareModal.classList.contains('flex') || subtitleMenu.classList.contains('flex') || mobilePlaylistModal.classList.contains('flex')) {
          resetAutoHideTimer();
          return;
        }
        bottomContainer.classList.add('auto-hidden');
      }, AUTO_HIDE_DELAY);
    }

    let subtitlePressTimer = null;
    let isSubtitleLongPress = false;

    subtitleBtn.addEventListener('mousedown', () => {
      isSubtitleLongPress = false;
      subtitlePressTimer = setTimeout(() => {
        isSubtitleLongPress = true;
        openSubtitleLanguageMenu();
      }, 500);
    });

    subtitleBtn.addEventListener('touchstart', () => {
      isSubtitleLongPress = false;
      subtitlePressTimer = setTimeout(() => {
        isSubtitleLongPress = true;
        openSubtitleLanguageMenu();
      }, 500);
    }, { passive: true });

    subtitleBtn.addEventListener('mouseup', () => {
      clearTimeout(subtitlePressTimer);
      if (!isSubtitleLongPress) toggleSubtitleMode(true);
    });

    subtitleBtn.addEventListener('touchend', () => {
      clearTimeout(subtitlePressTimer);
      if (!isSubtitleLongPress) toggleSubtitleMode(true);
    });

    document.addEventListener('click', (e) => {
      if (!subtitleBtn.contains(e.target) && !subtitleMenu.contains(e.target)) {
        subtitleMenu.classList.remove('flex');
        subtitleMenu.classList.add('hidden');
      }
      if (!featureBtn.contains(e.target) && !featureMenu.contains(e.target) && !historyModal.contains(e.target) && !shareModal.contains(e.target)) {
        featureMenu.classList.remove('flex');
        featureMenu.classList.add('hidden');
      }
    });

    timeSlider.addEventListener('mousedown', () => { isUserDraggingSlider = true; });
    timeSlider.addEventListener('touchstart', () => { isUserDraggingSlider = true; });

    timeSlider.addEventListener('input', (e) => {
      if (player && isApiReady && typeof player.getDuration === 'function') {
        const duration = player.getDuration();
        const targetTime = (e.target.value / 100) * duration;
        currentTimeEl.textContent = formatTime(targetTime);
      }
    });

    timeSlider.addEventListener('change', (e) => {
      if (player && isApiReady && typeof player.seekTo === 'function') {
        const duration = player.getDuration();
        const targetTime = (e.target.value / 100) * duration;
        player.seekTo(targetTime, true);
      }
      isUserDraggingSlider = false;
    });

    function initWebSocket() {
      syncIndicator.classList.remove('bg-green-500', 'shadow-[0_0_8px_rgba(34,197,94,0.8)]');
      syncIndicator.classList.add('bg-red-500', 'shadow-[0_0_8px_rgba(239,68,68,0.8)]');
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        syncIndicator.classList.remove('bg-red-500', 'shadow-[0_0_8px_rgba(239,68,68,0.8)]');
        syncIndicator.classList.add('bg-green-500', 'shadow-[0_0_8px_rgba(34,197,94,0.8)]');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.action === 'SYNC_STATE') {
            if (data.playlist) {
              const oldFirstId = playlist.length > 0 ? playlist[0].id : null;
              playlist = data.playlist;
              playHistory = data.history || [];
              updatePlaylistUI();

              if (playlist.length > 0) {
                if (playlist[0].id !== oldFirstId) checkAndPlayNext();
              } else {
                if (player && isApiReady && typeof player.stopVideo === 'function') player.stopVideo();
                updateTitleDisplay('Qimei Music Web (' + room + ')');
                playlistBtnLabel.textContent = '播放列表';
              }
            }

            if (data.playerState) {
              applyPlayerState(data.playerState);
            }
          } 
          else if (data.action === 'REMOTE_CMD') {
            handleRemoteCommand(data.command);
          } 
          else if (data.action === 'SEEK_TIME') {
            if (player && isApiReady && typeof player.getDuration === 'function') {
              player.seekTo((data.percent / 100) * player.getDuration(), true);
            }
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        syncIndicator.classList.remove('bg-green-500', 'shadow-[0_0_8px_rgba(34,197,94,0.8)]');
        syncIndicator.classList.add('bg-red-500', 'shadow-[0_0_8px_rgba(239,68,68,0.8)]');
        setTimeout(initWebSocket, 3000);
      };
    }

    function applyPlayerState(state) {
      if (typeof state.isPlaying === 'boolean' && player && isApiReady) {
        isPlaying = state.isPlaying;
        playPauseBtn.textContent = isPlaying ? '暫停' : '播放';
        if (isPlaying) player.playVideo(); else player.pauseVideo();
      }
      if (typeof state.speed === 'number' && player && isApiReady) {
        currentSpeed = state.speed;
        speedBtn.textContent = currentSpeed + 'x';
        player.setPlaybackRate(currentSpeed);
      }
      if (typeof state.isSubtitleActive === 'boolean' && isSubtitleActive !== state.isSubtitleActive) {
        isSubtitleActive = state.isSubtitleActive;
        updateSubtitleUIState();
      }
      if (typeof state.isAutoHiderEnabled === 'boolean' && isAutoHiderEnabled !== state.isAutoHiderEnabled) {
        isAutoHiderEnabled = state.isAutoHiderEnabled;
        autoHideBtn.textContent = isAutoHiderEnabled ? '自動隱藏介面: 開啟' : '自動隱藏介面: 關閉';
        autoHideBtn.classList.toggle('text-sky-400', isAutoHiderEnabled);
        autoHideBtn.classList.toggle('font-bold', isAutoHiderEnabled);
        if (!isAutoHiderEnabled) bottomContainer.classList.remove('auto-hidden');
      }
    }

    function broadcastPlayerState() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          action: 'UPDATE_PLAYER_STATE',
          state: {
            isPlaying: isPlaying,
            speed: currentSpeed,
            isSubtitleActive: isSubtitleActive,
            isAutoHiderEnabled: isAutoHiderEnabled
          }
        }));
      }
    }

    function handleRemoteCommand(cmd) {
      if (cmd === 'togglePlay') togglePlayPause(true);
      if (cmd === 'skip') skipToNextSong();
      if (cmd === 'speed') cyclePlaybackSpeed(true);
      if (cmd === 'subtitle') toggleSubtitleMode(true);
      if (cmd === 'autohide') {
        isAutoHiderEnabled = !isAutoHiderEnabled;
        autoHideBtn.textContent = isAutoHiderEnabled ? '自動隱藏介面: 開啟' : '自動隱藏介面: 關閉';
        autoHideBtn.classList.toggle('text-sky-400', isAutoHiderEnabled);
        autoHideBtn.classList.toggle('font-bold', isAutoHiderEnabled);
        if (!isAutoHiderEnabled) bottomContainer.classList.remove('auto-hidden');
        broadcastPlayerState();
      }
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          'autoplay': 1, 'controls': 0, 'disablekb': 1, 'fs': 0,
          'modestbranding': 1, 'rel': 0, 'playsinline': 1, 'cc_load_policy': 0, 'enablejsapi': 1
        },
        events: {
          'onReady': () => {
            isApiReady = true;
            initWebSocket();
            checkAndPlayNext();
            startTimeTracker();
            isSubtitleActive = false;
            updateSubtitleUIState();
            if (player && typeof player.unloadModule === 'function') {
              player.unloadModule('captions');
            }
          },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.ENDED) {
              skipToNextSong();
            } else if (e.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              playPauseBtn.textContent = '暫停';
              if (!isSubtitleActive && player && typeof player.unloadModule === 'function') {
                player.unloadModule('captions');
              }
            } else if (e.data === YT.PlayerState.PAUSED) {
              isPlaying = false;
              playPauseBtn.textContent = '播放';
            }
          },
          'onError': () => {
            triggerErrorAnimation();
            skipToNextSong();
          }
        }
      });
    }

    function skipToNextSong() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'moveToHistory' }));
      }
    }

    function checkAndPlayNext() {
      if (playlist.length > 0 && isApiReady && player && typeof player.loadVideoById === 'function') {
        isPlaying = true;
        playPauseBtn.textContent = '暫停';
        const curData = player.getVideoData ? player.getVideoData() : null;
        if (!curData || curData.video_id !== playlist[0].id) {
          player.loadVideoById(playlist[0].id);
          player.playVideo();
          player.setPlaybackRate(currentSpeed);
        }
        updateCurrentSongDisplay();

        if (!isSubtitleActive && typeof player.unloadModule === 'function') {
          player.unloadModule('captions');
        }
      } else {
        updateTitleDisplay('Qimei Music Web (' + room + ')');
        playlistBtnLabel.textContent = '播放列表';
      }
    }

    function updateTitleDisplay(titleText) {
      headerTitle.textContent = titleText;
      headerTitle.classList.remove('marquee-enabled');
      
      setTimeout(() => {
        if (headerTitle.scrollWidth > headerTitle.parentElement.clientWidth) {
          headerTitle.classList.add('marquee-enabled');
        }
      }, 50);
    }

    function updateCurrentSongDisplay() {
      if (playlist.length > 0) {
        updateTitleDisplay(playlist[0].title);
        playlistBtnLabel.textContent = `播放中 (${playlist.length})`;
      } else {
        updateTitleDisplay('Qimei Music Web (' + room + ')');
        playlistBtnLabel.textContent = '播放列表';
      }
    }

    function toggleSubtitleMode(broadcast) {
      isSubtitleActive = !isSubtitleActive;
      if (player && isApiReady) {
        if (isSubtitleActive) {
          if (typeof player.loadModule === 'function') player.loadModule('captions');
          player.setOption('captions', 'track', { languageCode: 'zh-Hant' });
        } else {
          if (typeof player.unloadModule === 'function') player.unloadModule('captions');
        }
      }
      updateSubtitleUIState();
      if (broadcast) broadcastPlayerState();
    }

    function updateSubtitleUIState() {
      if (isSubtitleActive) {
        playerContainer.classList.add('w-[75vw]', 'h-[65vh]', 'max-w-[1200px]', 'max-h-[675px]', 'rounded-2xl', 'shadow-[0_15px_35px_rgba(0,0,0,0.8)]');
        subtitleBtn.classList.add('bg-sky-400/40', 'border-sky-400');
      } else {
        playerContainer.classList.remove('w-[75vw]', 'h-[65vh]', 'max-w-[1200px]', 'max-h-[675px]', 'rounded-2xl', 'shadow-[0_15px_35px_rgba(0,0,0,0.8)]');
        subtitleBtn.classList.remove('bg-sky-400/40', 'border-sky-400');
        subtitleMenu.classList.remove('flex');
        subtitleMenu.classList.add('hidden');
      }
    }

    function normalizeLangCode(code) {
      if (!code) return '';
      return String(code).toLowerCase().replace(/_/g, '-').trim();
    }

    function openSubtitleLanguageMenu() {
      if (!player || !isApiReady || typeof player.getOptions !== 'function') return;
      subtitleMenu.innerHTML = '';
      let availableTracks = [];
      try {
        availableTracks = player.getOption('captions', 'tracklist') || [];
      } catch (e) {}

      if (availableTracks.length === 0) {
        const noSubOption = document.createElement('button');
        noSubOption.className = 'bg-transparent border-none text-white px-3 py-2 text-left text-[13px] rounded-md cursor-pointer hover:bg-white/20 hover:text-sky-400 transition-colors whitespace-nowrap overflow-hidden text-ellipsis shrink-0';
        noSubOption.textContent = '無可用字幕';
        noSubOption.onclick = () => {
          subtitleMenu.classList.remove('flex');
          subtitleMenu.classList.add('hidden');
        };
        subtitleMenu.appendChild(noSubOption);
      } else {
        const offOption = document.createElement('button');
        offOption.className = 'bg-transparent border-none text-white px-3 py-2 text-left text-[13px] rounded-md cursor-pointer hover:bg-white/20 hover:text-sky-400 transition-colors whitespace-nowrap overflow-hidden text-ellipsis shrink-0';
        offOption.textContent = '關閉字幕';
        offOption.onclick = () => {
          isSubtitleActive = false;
          if (typeof player.unloadModule === 'function') player.unloadModule('captions');
          updateSubtitleUIState();
          subtitleMenu.classList.remove('flex');
          subtitleMenu.classList.add('hidden');
          broadcastPlayerState();
        };
        subtitleMenu.appendChild(offOption);

        availableTracks.forEach(track => {
          const rawCode = String(track.languageCode || '').trim();
          const normalizedCode = normalizeLangCode(rawCode);
          let langName = languageMap[rawCode] || languageMap[normalizedCode] || track.name || rawCode;

          const btn = document.createElement('button');
          btn.className = 'bg-transparent border-none text-white px-3 py-2 text-left text-[13px] rounded-md cursor-pointer hover:bg-white/20 hover:text-sky-400 transition-colors whitespace-nowrap overflow-hidden text-ellipsis shrink-0';
          btn.textContent = langName;
          btn.onclick = () => {
            isSubtitleActive = true;
            if (typeof player.loadModule === 'function') player.loadModule('captions');
            player.setOption('captions', 'track', { languageCode: rawCode });
            updateSubtitleUIState();
            subtitleMenu.classList.remove('flex');
            subtitleMenu.classList.add('hidden');
            broadcastPlayerState();
          };
          subtitleMenu.appendChild(btn);
        });
      }
      subtitleMenu.classList.remove('hidden');
      subtitleMenu.classList.add('flex');
    }

    document.addEventListener('keydown', (e) => {
      wakeUpUI();
      const isInputActive = document.activeElement === urlInput;
      if ((e.key === 'n' || e.key === 'N') && !isInputActive) {
        e.preventDefault();
        expandInput();
      } else if ((e.key === 'l' || e.key === 'L') && !isInputActive) {
        e.preventDefault();
        skipToNextSong();
      } else if (e.code === 'Space' && !isInputActive) {
        e.preventDefault();
        togglePlayPause(true);
      } else if (e.key === 'Escape') {
        collapseInput();
        subtitleMenu.classList.remove('flex');
        subtitleMenu.classList.add('hidden');
        featureMenu.classList.remove('flex');
        featureMenu.classList.add('hidden');
        mobilePlaylistModal.classList.remove('flex');
        mobilePlaylistModal.classList.add('hidden');
        historyModal.classList.remove('flex');
        historyModal.classList.add('hidden');
        shareModal.classList.remove('flex');
        shareModal.classList.add('hidden');
      }
    });

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const url = urlInput.value.trim();
        if (url) processYouTubeUrl(url);
      }
    });

    function togglePlayPause(broadcast) {
      if (playlist.length === 0) return;
      if (player && isApiReady) {
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
          player.pauseVideo();
          isPlaying = false;
          playPauseBtn.textContent = '播放';
        } else {
          player.playVideo();
          isPlaying = true;
          playPauseBtn.textContent = '暫停';
        }
        if (broadcast) broadcastPlayerState();
      }
    }

    function cyclePlaybackSpeed(broadcast) {
      if (player && isApiReady && typeof player.setPlaybackRate === 'function') {
        const currentIndex = speeds.indexOf(currentSpeed);
        const nextIndex = (currentIndex !== -1) ? (currentIndex + 1) % speeds.length : 0;
        currentSpeed = speeds[nextIndex];
        player.setPlaybackRate(currentSpeed);
        speedBtn.textContent = `${currentSpeed}x`;
        if (broadcast) broadcastPlayerState();
      }
    }

    function startTimeTracker() {
      if (timeUpdateInterval) clearInterval(timeUpdateInterval);
      timeUpdateInterval = setInterval(() => {
        if (player && isApiReady && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
          const currentTime = player.getCurrentTime() || 0;
          const duration = player.getDuration() || 0;
          currentTimeEl.textContent = formatTime(currentTime);
          durationTimeEl.textContent = formatTime(duration);
          if (!isUserDraggingSlider && duration > 0) {
            timeSlider.value = (currentTime / duration) * 100;
          }

          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'SYNC_TIME', currentTime, duration }));
          }
        }
      }, 500);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function expandInput() {
      inputContainer.classList.add('w-80', 'bg-black/85', 'border-sky-400');
      urlInput.classList.remove('hidden');
      urlInput.classList.add('block');
      playlistBtnLabel.classList.add('hidden');
      urlInput.focus();
    }

    function collapseInput() {
      inputContainer.classList.remove('w-80', 'bg-black/85', 'border-sky-400');
      urlInput.classList.remove('block');
      urlInput.classList.add('hidden');
      playlistBtnLabel.classList.remove('hidden');
      urlInput.value = '';
      urlInput.blur();
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function fetchVideoDetails(videoId) {
      let title = `YouTube Track (${videoId})`;
      let durationStr = '03:30';

      try {
        const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
        if (res.ok) {
          const data = await res.json();
          if (data.title) title = data.title;
        }
      } catch (e) {}

      if (title === `YouTube Track (${videoId})`) {
        try {
          const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
          if (res.ok) {
            const data = await res.json();
            if (data.title) title = data.title;
          }
        } catch (e) {}
      }

      durationStr = await fetchDurationInBackground(videoId);
      return { title, durationStr };
    }

    function fetchDurationInBackground(videoId) {
      return new Promise((resolve) => {
        if (player && isApiReady && typeof player.getDuration === 'function' && playlist.length > 0 && playlist[0].id === videoId) {
          const d = player.getDuration();
          if (d > 0) {
            resolve(formatTime(d));
            return;
          }
        }

        const tempDivId = 'temp_duration_getter_' + Date.now();
        const div = document.createElement('div');
        div.id = tempDivId;
        div.style.display = 'none';
        document.body.appendChild(div);

        let tempPlayer;
        let resolved = false;

        const cleanup = () => {
          if (!resolved) {
            resolved = true;
            try {
              if (tempPlayer && typeof tempPlayer.destroy === 'function') tempPlayer.destroy();
            } catch (err) {}
            if (div.parentNode) div.parentNode.removeChild(div);
            resolve('03:30');
          }
        };

        const timeoutTimer = setTimeout(cleanup, 5000);

        try {
          tempPlayer = new YT.Player(tempDivId, {
            height: '1',
            width: '1',
            videoId: videoId,
            playerVars: { 'autoplay': 0, 'controls': 0 },
            events: {
              'onReady': (event) => {
                try {
                  const dur = event.target.getDuration();
                  if (dur && dur > 0) {
                    if (!resolved) {
                      resolved = true;
                      clearTimeout(timeoutTimer);
                      const formatted = formatTime(dur);
                      try { event.target.destroy(); } catch (e) {}
                      if (div.parentNode) div.parentNode.removeChild(div);
                      resolve(formatted);
                    }
                  } else {
                    setTimeout(() => {
                      try {
                        const d2 = event.target.getDuration();
                        if (!resolved) {
                          resolved = true;
                          clearTimeout(timeoutTimer);
                          const formatted2 = (d2 && d2 > 0) ? formatTime(d2) : '03:30';
                          try { event.target.destroy(); } catch (e) {}
                          if (div.parentNode) div.parentNode.removeChild(div);
                          resolve(formatted2);
                        }
                      } catch (err) {
                        cleanup();
                      }
                    }, 1000);
                  }
                } catch (err) {
                  cleanup();
                }
              },
              'onError': () => {
                clearTimeout(timeoutTimer);
                cleanup();
              }
            }
          });
        } catch (e) {
          clearTimeout(timeoutTimer);
          cleanup();
        }
      });
    }

    async function processYouTubeUrl(url) {
      const videoId = extractVideoId(url);
      if (!videoId) {
        triggerErrorAnimation();
        return;
      }

      const { title: videoTitle, durationStr } = await fetchVideoDetails(videoId);
      collapseInput();

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          action: 'addSong',
          song: {
            id: videoId,
            title: videoTitle,
            videoDuration: durationStr
          }
        }));
      }
    }

    function renderHistoryUI() {
      historyList.innerHTML = '';
      if (playHistory.length === 0) {
        const emptyItem = document.createElement('div');
        emptyItem.className = 'bg-white/5 border border-white/10 rounded-lg p-2 text-center text-white/40 text-xs';
        emptyItem.textContent = '目前尚無點歌紀錄';
        historyList.appendChild(emptyItem);
        return;
      }

      playHistory.forEach(item => {
        const historyEl = document.createElement('div');
        historyEl.className = 'bg-white/10 border border-white/15 rounded-lg p-2 cursor-pointer transition-all hover:bg-white/20 hover:border-sky-400 flex flex-col gap-1';
        historyEl.innerHTML = `
          <div class="text-[13px] font-bold whitespace-nowrap overflow-hidden text-ellipsis">${item.title}</div>
          <div class="text-[11px] text-white/60 flex justify-between">
            <span>點歌時間: ${item.requestTime}</span>
            <span>影片時長: ${item.videoDuration}</span>
          </div>
        `;
        historyEl.onclick = () => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              action: 'addSong',
              song: {
                id: item.id,
                title: item.title,
                videoDuration: item.videoDuration || '03:30'
              }
            }));
          }
          historyModal.classList.remove('flex');
          historyModal.classList.add('hidden');
        };
        historyList.appendChild(historyEl);
      });
    }

    function triggerErrorAnimation() {
      inputContainer.classList.add('error-shake');
      setTimeout(() => inputContainer.classList.remove('error-shake'), 500);
    }

    function updatePlaylistUI() {
      updateCurrentSongDisplay();
      renderListToContainer(document.getElementById('songList'));
      renderListToContainer(document.getElementById('mobileSongList'));
    }

    function renderListToContainer(containerEl) {
      if (!containerEl) return;
      containerEl.innerHTML = '';

      playlist.forEach((song, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'relative w-full rounded-lg overflow-hidden bg-transparent transition-colors duration-300 shrink-0';

        const deleteBg = document.createElement('div');
        deleteBg.className = 'absolute top-0 left-0 w-full h-full flex items-center pl-3.5 text-white text-[13px] font-bold z-1 opacity-0 transition-opacity duration-200';
        deleteBg.textContent = playlist.length === 1 ? '⚠️ 這是最後一首了' : '🗑️ 刪除';
        wrapper.appendChild(deleteBg);

        const item = document.createElement('div');
        item.className = 'bg-black/85 backdrop-blur-sm rounded-lg py-2 px-3 text-sm overflow-hidden whitespace-nowrap border-l-[3px] border-sky-400 relative z-2 cursor-grab select-none touch-pan-y active:cursor-grabbing';

        const prefix = index === 0 ? '▶ ' : `${index + 1}. `;
        const fullText = prefix + song.title;

        if (fullText.length > 20) {
          item.innerHTML = `<div class="marquee">${fullText}&nbsp;&nbsp;&nbsp;&nbsp;${fullText}</div>`;
        } else {
          item.textContent = fullText;
        }

        wrapper.appendChild(item);
        containerEl.appendChild(wrapper);

        initSwipeToDelete(item, wrapper, index);
      });
    }

    function initSwipeToDelete(itemEl, wrapperEl, index) {
      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      function onStart(clientX) {
        isDragging = true;
        startX = clientX;
        itemEl.style.transition = 'none';
        wrapperEl.classList.add('bg-red-500/80');
        if (playlist.length > 1) wrapperEl.classList.add('bg-red-500/80');
      }

      function onMove(clientX) {
        if (!isDragging) return;
        currentX = clientX - startX;
        if (currentX > 0) {
          itemEl.style.transform = `translateX(${currentX}px)`;
          wrapperEl.firstElementChild.style.opacity = '1';
        } else {
          itemEl.style.transform = `translateX(0px)`;
          wrapperEl.firstElementChild.style.opacity = '0';
        }
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        itemEl.style.transition = 'transform 0.3s ease';
        wrapperEl.classList.remove('bg-red-500/80');

        if (playlist.length === 1 && currentX > 80) {
          itemEl.style.transform = `translateX(0px)`;
          wrapperEl.classList.add('bg-red-500/85', 'animate-[flashWarning_0.4s_ease-in-out]');
          setTimeout(() => wrapperEl.classList.remove('bg-red-500/85', 'animate-[flashWarning_0.4s_ease-in-out]'), 400);
        } else if (playlist.length > 1 && currentX > 120) {
          itemEl.style.transform = `translateX(100%)`;
          setTimeout(() => removeSongAtIndex(index), 250);
        } else {
          itemEl.style.transform = `translateX(0px)`;
        }
        currentX = 0;
      }

      itemEl.addEventListener('mousedown', (e) => {
        onStart(e.clientX);
        const mm = (me) => onMove(me.clientX);
        const mu = () => {
          onEnd();
          window.removeEventListener('mousemove', mm);
          window.removeEventListener('mouseup', mu);
        };
        window.addEventListener('mousemove', mm);
        window.addEventListener('mouseup', mu);
      });

      itemEl.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX), { passive: true });
      itemEl.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
      itemEl.addEventListener('touchend', () => onEnd());
    }

    function removeSongAtIndex(index) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        if (index === 0) {
          ws.send(JSON.stringify({ action: 'moveToHistory' }));
        } else {
          ws.send(JSON.stringify({ action: 'removeSong', index: index }));
        }
      }
    }
  </script>
