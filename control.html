<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qimei Music Control Center</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Lucide Icons 圖示庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 12s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white font-sans overflow-x-hidden">

  <!-- 頂部導覽列 -->
  <header class="w-full px-6 py-4 flex items-center justify-between border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md sticky top-0 z-30">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.6)] transition-all duration-300" id="syncIndicator"></div>
      <h1 class="font-bold text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-400">QIMEI CONTROL</h1>
    </div>
    <div class="flex items-center space-x-2">
      <span class="text-xs px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-slate-400 font-mono" id="roomDisplay">房間: 載入中...</span>
    </div>
  </header>

  <!-- 主要控制與播放清單區域 -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">

    <!-- 目前播放中卡片 -->
    <section class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-5 shadow-2xl relative overflow-hidden flex flex-col gap-4">
      <div class="absolute -right-10 -top-10 w-40 h-40 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold tracking-widest text-sky-400 uppercase flex items-center gap-1.5">
          <i data-lucide="radio" class="w-4 h-4 animate-pulse"></i> Now Playing
        </span>
        <span class="text-xs text-slate-400 font-mono" id="speedBadge">1.0x</span>
      </div>

      <!-- 標題跑馬燈 -->
      <div class="overflow-hidden w-full relative py-1">
        <div id="currentSongTitle" class="text-lg md:text-xl font-bold text-white whitespace-nowrap">
          尚無播放中的曲目
        </div>
      </div>

      <!-- 進度條 -->
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between text-xs text-slate-400 font-mono">
          <span id="currentTime">00:00</span>
          <span id="durationTime">00:00</span>
        </div>
        <input type="range" id="timeSlider" value="0" min="0" max="100" step="0.1" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-sky-500 transition-all">
      </div>

      <!-- 主控制按鈕列 -->
      <div class="grid grid-cols-5 gap-2 pt-2">
        <button onclick="sendRemoteCommand('togglePlay')" class="flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 hover:border-sky-500/50 transition active:scale-95 group">
          <i data-lucide="play" class="w-5 h-5 text-sky-400 group-hover:scale-110 transition"></i>
          <span class="text-[11px] text-slate-300 mt-1">播放/暫停</span>
        </button>
        <button onclick="sendRemoteCommand('skip')" class="flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 hover:border-sky-500/50 transition active:scale-95 group">
          <i data-lucide="skip-forward" class="w-5 h-5 text-sky-400 group-hover:scale-110 transition"></i>
          <span class="text-[11px] text-slate-300 mt-1">切歌</span>
        </button>
        <button onclick="sendRemoteCommand('speed')" class="flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 hover:border-sky-500/50 transition active:scale-95 group">
          <i data-lucide="gauge" class="w-5 h-5 text-sky-400 group-hover:scale-110 transition"></i>
          <span class="text-[11px] text-slate-300 mt-1">倍速</span>
        </button>
        <button onclick="sendRemoteCommand('subtitle')" class="flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 hover:border-sky-500/50 transition active:scale-95 group">
          <i data-lucide="captions" class="w-5 h-5 text-sky-400 group-hover:scale-110 transition"></i>
          <span class="text-[11px] text-slate-300 mt-1">字幕</span>
        </button>
        <button onclick="sendRemoteCommand('autohide')" class="flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 hover:border-sky-500/50 transition active:scale-95 group">
          <i data-lucide="eye-off" class="w-5 h-5 text-sky-400 group-hover:scale-110 transition"></i>
          <span class="text-[11px] text-slate-300 mt-1">自動隱藏</span>
        </button>
      </div>
    </section>

    <!-- 點歌輸入區 -->
    <section class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-3">
      <label class="text-sm font-semibold text-slate-300 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4 text-sky-400"></i> 新增 YouTube 歌曲
      </label>
      <div class="flex gap-2">
        <input type="text" id="urlInput" placeholder="請貼上 YouTube 影片網址..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition">
        <button onclick="submitUrl()" class="bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 text-white font-medium px-6 py-3 rounded-xl text-sm transition shadow-lg shadow-sky-500/25 active:scale-95 flex items-center gap-2">
          <i data-lucide="send" class="w-4 h-4"></i> 點歌
        </button>
      </div>
    </section>

    <!-- 播放清單管理區 -->
    <section class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-3 flex-1 min-h-[250px]">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <span class="text-sm font-semibold text-slate-300 flex items-center gap-2">
          <i data-lucide="list-music" class="w-4 h-4 text-sky-400"></i> 播放清單
        </span>
        <span class="text-xs text-slate-400 font-mono" id="playlistCount">0 首歌曲</span>
      </div>
      <div id="playlistContainer" class="flex flex-col gap-2 overflow-y-auto max-h-[300px] pr-1">
        <!-- 動態渲染清單項目 -->
        <div class="text-center py-8 text-slate-500 text-sm">目前播放清單為空</div>
      </div>
    </section>

  </main>

  <!-- 現代精美 Tailwind 訊息/提示彈窗 -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
    <i data-lucide="info" class="w-5 h-5 text-sky-400" id="toastIcon"></i>
    <span class="text-sm text-slate-200" id="toastMessage">提示訊息</span>
  </div>

  <script>
    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || 'default_room';
    document.getElementById('roomDisplay').textContent = `房間: ${room}`;

    const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const WS_URL = wsProtocol + window.location.host + '/ws?room=' + encodeURIComponent(room);
    let ws = null;

    let playlist = [];
    let isUserDraggingSlider = false;

    const syncIndicator = document.getElementById('syncIndicator');
    const currentSongTitle = document.getElementById('currentSongTitle');
    const timeSlider = document.getElementById('timeSlider');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const playlistContainer = document.getElementById('playlistContainer');
    const playlistCount = document.getElementById('playlistCount');
    const urlInput = document.getElementById('urlInput');

    function initWebSocket() {
      syncIndicator.classList.remove('bg-emerald-500', 'shadow-[0_0_10px_rgba(16,185,129,0.6)]');
      syncIndicator.classList.add('bg-rose-500', 'shadow-[0_0_10px_rgba(244,63,94,0.6)]');

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        syncIndicator.classList.remove('bg-rose-500', 'shadow-[0_0_10px_rgba(244,63,94,0.6)]');
        syncIndicator.classList.add('bg-emerald-500', 'shadow-[0_0_10px_rgba(16,185,129,0.6)]');
        showToast('已成功連線至同步房間', 'success');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.action === 'SYNC_STATE') {
            if (data.playlist) {
              playlist = data.playlist;
              renderPlaylist();
            }
            if (data.playerState) {
              if (data.playerState.speed) {
                document.getElementById('speedBadge').textContent = `${data.playerState.speed}x`;
              }
            }
          } else if (data.action === 'SYNC_TIME') {
            if (!isUserDraggingSlider && data.duration > 0) {
              timeSlider.value = (data.currentTime / data.duration) * 100;
              currentTimeEl.textContent = formatTime(data.currentTime);
              durationTimeEl.textContent = formatTime(data.duration);
            }
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        syncIndicator.classList.remove('bg-emerald-500', 'shadow-[0_0_10px_rgba(16,185,129,0.6)]');
        syncIndicator.classList.add('bg-rose-500', 'shadow-[0_0_10px_rgba(244,63,94,0.6)]');
        setTimeout(initWebSocket, 3000);
      };
    }

    function sendRemoteCommand(command) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'REMOTE_CMD', command: command }));
        showToast(`已傳送指令: ${command}`, 'info');
      } else {
        showToast('尚未連線至伺服器', 'error');
      }
    }

    timeSlider.addEventListener('mousedown', () => { isUserDraggingSlider = true; });
    timeSlider.addEventListener('touchstart', () => { isUserDraggingSlider = true; });

    timeSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'SEEK_TIME', percent: parseFloat(val) }));
      }
    });

    timeSlider.addEventListener('change', () => {
      isUserDraggingSlider = false;
    });

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitUrl();
    });

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function submitUrl() {
      const url = urlInput.value.trim();
      const videoId = extractVideoId(url);
      if (!videoId) {
        showToast('無效的 YouTube 連結', 'error');
        return;
      }

      showToast('正在解析影片資訊...', 'info');
      let title = `YouTube Track (${videoId})`;
      try {
        const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
        if (res.ok) {
          const data = await res.json();
          if (data.title) title = data.title;
        }
      } catch (e) {}

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          action: 'addSong',
          song: { id: videoId, title: title, videoDuration: '03:30' }
        }));
        urlInput.value = '';
        showToast('已成功新增歌曲至清單！', 'success');
      }
    }

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      playlistCount.textContent = `${playlist.length} 首歌曲`;

      if (playlist.length === 0) {
        playlistContainer.innerHTML = '<div class="text-center py-8 text-slate-500 text-sm">目前播放清單為空</div>';
        currentSongTitle.textContent = '尚無播放中的曲目';
        currentSongTitle.classList.remove('animate-marquee');
        return;
      }

      currentSongTitle.textContent = playlist[0].title;
      if (playlist[0].title.length > 20) {
        currentSongTitle.classList.add('animate-marquee');
      } else {
        currentSongTitle.classList.remove('animate-marquee');
      }

      playlist.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = `flex items-center justify-between p-3 rounded-xl border transition ${index === 0 ? 'bg-sky-500/10 border-sky-500/40 text-sky-300' : 'bg-slate-950/40 border-slate-800 text-slate-300 hover:border-slate-700'}`;
        
        item.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <span class="text-xs font-mono opacity-60">${index === 0 ? '▶' : index + 1}</span>
            <span class="text-sm truncate">${song.title}</span>
          </div>
          <button onclick="removeSong(${index})" class="p-1.5 rounded-lg hover:bg-rose-500/20 hover:text-rose-400 text-slate-500 transition">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        `;
        playlistContainer.appendChild(item);
      });
      lucide.createIcons();
    }

    function removeSong(index) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        if (index === 0) {
          ws.send(JSON.stringify({ action: 'moveToHistory' }));
        } else {
          ws.send(JSON.stringify({ action: 'removeSong', index: index }));
        }
        showToast('已刪除指定歌曲', 'info');
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');

      toastMessage.textContent = message;
      
      if (type === 'success') {
        toastIcon.setAttribute('data-lucide', 'check-circle');
        toastIcon.className = 'w-5 h-5 text-emerald-400';
      } else if (type === 'error') {
        toastIcon.setAttribute('data-lucide', 'alert-circle');
        toastIcon.className = 'w-5 h-5 text-rose-400';
      } else {
        toastIcon.setAttribute('data-lucide', 'info');
        toastIcon.className = 'w-5 h-5 text-sky-400';
      }
      lucide.createIcons();

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    initWebSocket();
  </script>
</body>
</html>
